  <div style="display:grid;gap:8px;font-size:13px;margin-bottom:14px">
   <div>Status: ${stat}</div>
   <div>Folder: <b>${hasFolder?esc(abCfg.folderName):'-'}</b></div>
   <div>Backup terakhir: <b>${fmt(abCfg.lastAt)}</b>${abCfg.lastName?' · '+esc(abCfg.lastName):''}</div>
   ${abCfg.lastErr?`<div style="color:var(--er)">⚠️ ${esc(abCfg.lastErr)}</div>`:''}
  </div>
  <div style="display:flex;gap:10px 16px;flex-wrap:wrap;margin-bottom:14px">
   <label style="display:grid;gap:4px;font-size:12px;color:var(--mt)">Jadwal${sel('ab_mode','abSetMode',abCfg.mode,[['change','Setiap ada perubahan data'],['hourly','Maksimal 1x per jam'],['daily','Maksimal 1x per hari']])}</label>
   <label style="display:grid;gap:4px;font-size:12px;color:var(--mt)">Simpan file terakhir${sel('ab_keep','abSetKeep',abCfg.keep,[[7,'7 hari'],[14,'14 hari'],[30,'30 hari'],[90,'90 hari']])}</label>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">

  </div>
  <p class="mt" style="font-size:12px;margin:12px 0 0">Catatan: setelah browser ditutup lalu dibuka lagi, Chrome/Edge meminta izin akses folder ulang; tombol <b>Aktifkan Auto Backup</b> akan muncul di Dashboard. Pilih subfolder khusus (mis. <code>Documents\\Backup MIMS</code>); folder sistem seperti Desktop atau Downloads biasanya ditolak browser.</p>
 </div>`;
}

/* ==========================================================================
   [22] ANIMASI GRAFIK DASHBOARD
   --------------------------------------------------------------------------
   Tujuan   : Grafik batang (penerimaan vs pemakaian), batang horizontal (Stok per Kategori),
              dan donut (Kondisi Stok, Status Request) bergerak HANYA saat terlihat di layar.
   Cara kerja: MutationObserver mendeteksi grafik yang baru dirender -> prepare() menaruhnya
              di keadaan awal (nol) -> IntersectionObserver memanggil play() saat grafik terlihat.
   Catatan  : Tidak ada data yang diubah. Dimatikan otomatis bila sistem meminta
              pengurangan gerak (prefers-reduced-motion).
   Cara ubah: Durasi & kurva ada di play(). Matikan satu jenis: hapus selectornya di scan().
   ========================================================================== */
(function chartAnim(){
 if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const ease=t=>1-Math.pow(1-t,3);

 /** Menaruh grafik pada keadaan awal (nol) sebelum terlihat. */
 function prepare(el){
  if(el.classList.contains('chart-area')){
   el.querySelectorAll('.chart-bars span').forEach(s=>{
    s.dataset.h=s.style.height;
    s.style.transition='none';
    s.style.height='0%';
   });
  }else if(el.classList.contains('br')){
   const b=el.querySelector('i b');
   if(b){b.dataset.w=b.style.width;b.style.transition='none';b.style.width='0%'}
  }else if(el.classList.contains('status-donut-wrap')){
   el.querySelectorAll('circle.seg').forEach(c=>{
    c.dataset.len=parseFloat(String(c.getAttribute('stroke-dasharray')||'0').split(/\s+/)[0])||0;
    c.setAttribute('stroke-dasharray','0 100');
   });
  }
 }

 /** Menjalankan animasi grafik yang sudah terlihat. */
 function play(el){
  if(el.classList.contains('chart-area')){
   el.querySelectorAll('.chart-col').forEach((col,ci)=>{
    col.querySelectorAll('.chart-bars span').forEach((s,si)=>{
     s.style.transition=`height .9s cubic-bezier(.2,.8,.2,1) ${ci*45+si*90}ms`;
     s.style.height=s.dataset.h||'0%';
    });
   });
  }else if(el.classList.contains('br')){
   const b=el.querySelector('i b');
   if(b){b.style.transition='width 1s cubic-bezier(.2,.8,.2,1)';b.style.width=b.dataset.w||'0%'}
  }else if(el.classList.contains('status-donut-wrap')){
   el.querySelectorAll('circle.seg').forEach((c,i)=>{
    const target=parseFloat(c.dataset.len)||0;
    const start=performance.now()+i*150,dur=1000;
    const step=now=>{
     const t=Math.min(1,Math.max(0,(now-start)/dur));
     const v=target*ease(t);
     c.setAttribute('stroke-dasharray',`${v.toFixed(3)} ${(100-v).toFixed(3)}`);
     if(t<1)requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
   });
  }
 }

 const io=('IntersectionObserver' in window)?new IntersectionObserver(entries=>{
  entries.forEach(en=>{
   if(en.isIntersecting){io.unobserve(en.target);play(en.target)}
  });
 },{threshold:0.25}):null;

 /** Mencari grafik baru di #app yang belum disiapkan, lalu menyiapkannya. */
 function scan(){
  document.querySelectorAll('.chart-area:not([data-anim]),.br:not([data-anim]),.status-donut-wrap:not([data-anim])').forEach(el=>{
   el.dataset.anim='1';
   prepare(el);
   if(io)io.observe(el);else play(el);
  });
 }

 const app=document.getElementById('app');
 if(app)new MutationObserver(scan).observe(app,{childList:true,subtree:true});
 scan();
})();

/* ==========================================================================
   [21] INISIALISASI APLIKASI (urutan boot)
   --------------------------------------------------------------------------
   Tujuan   : Menjalankan aplikasi setelah semua definisi di atas siap. Harus PALING BAWAH.
   ========================================================================== */

/* Bridge aman antara aplikasi MIMS (script klasik) dan modul Firebase. */
window.__mimsGetLocalPayload=()=>JSON.stringify(S);
window.__mimsPersistRemote=json=>dataPut(json).then(()=>{dataVer++;});
window.__mimsRefreshAfterRemote=()=>{
 if(currentUser){
  renderNav();
  render();
 }
};
window.__mimsGetCurrentPayload=()=>S;

/* Sinyal bahwa data lokal MIMS selesai dimuat sebelum Firebase menentukan payload awal. */
window.__mimsAppReady=new Promise(resolve=>{window.__mimsResolveAppReady=resolve;});

/* Urutan boot (JANGAN diubah urutannya):
   1) tema -> 2) muat data (atau seed contoh) -> 3) siapkan Auto Backup ->
   4) cek sesi login tersimpan -> 5) jika sudah login langsung buka Dashboard. */
initTheme();
const loginBtn=document.getElementById('loginSubmit');
if(loginBtn)loginBtn.disabled=true;   // login baru aktif setelah data selesai dimuat
load().catch(e=>console.error('[MIMS] Gagal memuat data:',e)).then(()=>{
 if(window.__mimsResolveAppReady)window.__mimsResolveAppReady();
 if(loginBtn)loginBtn.disabled=false;
 qLoad();
 try{abInit()}catch(e){}
 checkSession();
 if(currentUser){renderNav();go('dash');}
});

</script>
<!-- Status sinkronisasi Firebase seluruh data MIMS -->
<div id="mims-firebase-sync-status" role="status"
 style="position:fixed;right:14px;bottom:14px;z-index:1999;padding:8px 12px;border-radius:8px;
 background:#263238;color:#fff;font:12px/1.4 Arial,sans-serif;box-shadow:0 2px 10px #0003">
 Firebase: menghubungkan...
</div>

<!-- Sinkronisasi seluruh state MIMS ke Realtime Database pada /mims/payload -->
<script type="module">
  import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import {
    getDatabase, ref, set, onValue, get
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    databaseURL: "https://mims-database-default-rtdb.asia-southeast1.firebasedatabase.app"
  };

  const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
  const database = getDatabase(app);
  const payloadRef = ref(database, "mims/payload");
  let applyingRemote = false;
  let lastRemoteJson = "";
  let writeInProgress = Promise.resolve();

  const setStatus = (message, kind = "normal") => {
    const el = document.getElementById("mims-firebase-sync-status");
    if (!el) return;
    el.textContent = "Firebase: " + message;
    el.style.background = kind === "ok" ? "#176b3a" :
                          kind === "error" ? "#a32626" : "#263238";
  };
  window.__mimsFirebaseSetStatus = setStatus;

  const validMimsPayload = value =>
    value && typeof value === "object" &&
    Array.isArray(value.items) && Array.isArray(value.tx);

  const persistRemoteToLocal = async value => {
    if (!validMimsPayload(value)) {
      console.error("[MIMS Firebase] Payload tidak sesuai struktur MIMS:", value);
      setStatus("payload tidak valid", "error");
      return;
    }
    const remoteJson = JSON.stringify(value);
    if (remoteJson === JSON.stringify(window.S || {})) {
      lastRemoteJson = remoteJson;
      setStatus("tersinkron", "ok");
      return;
    }

    applyingRemote = true;
    try {
      // Mengganti state aplikasi dengan payload terbaru, lalu menyimpan ke IndexedDB.
      window.__mimsApplyRemotePayload(value);
      lastRemoteJson = remoteJson;
      setStatus("data terbaru diterima", "ok");
    } catch (error) {
      console.error("[MIMS Firebase] Gagal menerapkan payload:", error);
      setStatus("gagal menerapkan data", "error");
    } finally {
      applyingRemote = false;
    }
  };

  // Dipanggil oleh save() setiap kali ada perubahan pada data utama MIMS.
  window.__mimsFirebaseWrite = json => {
    if (applyingRemote) return Promise.resolve();
    let value;
    try { value = JSON.parse(json); }
    catch (error) { return Promise.reject(error); }
    if (!validMimsPayload(value)) {
      return Promise.reject(new Error("Struktur data MIMS tidak valid; payload tidak dikirim."));
    }
    const outgoingJson = JSON.stringify(value);
    if (outgoingJson === lastRemoteJson) {
      setStatus("tersinkron", "ok");
      return Promise.resolve();
    }

    // Antrekan penulisan agar urutan perubahan dari satu browser tetap terjaga.
    writeInProgress = writeInProgress.then(() => set(payloadRef, value)).then(() => {
      lastRemoteJson = outgoingJson;
      setStatus("tersinkron", "ok");
    });
    setStatus("mengirim data...", "normal");
    return writeInProgress;
  };

  // Terapkan data Firebase ke state MIMS dan IndexedDB tanpa memicu echo write.
  window.__mimsApplyRemotePayload = value => {
    if (!validMimsPayload(value)) throw new Error("Payload Firebase bukan data MIMS yang valid.");
    window.S = value;
    if (!Array.isArray(window.S.reqs)) window.S.reqs = [];
    if (!Array.isArray(window.S.reqForms)) window.S.reqForms = [];
    if (!Array.isArray(window.S.reqArchive)) window.S.reqArchive = [];
    if (!Array.isArray(window.S.opnames)) window.S.opnames = [];
    if (!Array.isArray(window.S.pics)) window.S.pics = [];
    if (!window.S.meta || typeof window.S.meta !== "object") window.S.meta = {};
    window.__mimsPersistRemote(JSON.stringify(window.S));
    window.__mimsRefreshAfterRemote();
  };

  try {
    setStatus("menunggu data lokal MIMS...");
    if (window.__mimsAppReady) await window.__mimsAppReady;
    setStatus("memeriksa database...");
    const initial = await get(payloadRef);
    if (initial.exists()) {
      const remote = initial.val();
      if (!validMimsPayload(remote)) {
        throw new Error("Data /mims/payload ditemukan tetapi strukturnya bukan payload MIMS.");
      }
      await persistRemoteToLocal(remote);
    } else {
      // Database masih kosong: unggah state lokal yang sudah dimuat oleh MIMS.
      const localJson = window.__mimsGetLocalPayload();
      if (localJson) await window.__mimsFirebaseWrite(localJson);
      else setStatus("menunggu data MIMS", "normal");
    }

    onValue(payloadRef, snapshot => {
      if (!snapshot.exists()) return;
      const value = snapshot.val();
      const incomingJson = JSON.stringify(value);
      if (incomingJson === lastRemoteJson) return;
      persistRemoteToLocal(value);
    }, error => {
      console.error("[MIMS Firebase] Listener error:", error);
      setStatus("gagal membaca database", "error");
    });

    setStatus("terhubung", "ok");
  } catch (error) {
    console.error("[MIMS Firebase] Inisialisasi/sinkronisasi gagal:", error);
    setStatus("gagal terhubung", "error");
  }

  // Saat koneksi pulih, kirim state lokal terakhir ke Firebase.
  window.addEventListener("online", () => {
    const localJson = window.__mimsGetLocalPayload();
    if (localJson) window.__mimsFirebaseWrite(localJson)
      .catch(error => {
        console.error("[MIMS Firebase] Sinkronisasi ulang gagal:", error);
        setStatus("gagal sinkron ulang", "error");
      });
  });
</script></html>
