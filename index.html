  <select aria-label="Urutkan" onchange="F.sort=this.value;drawTable()">${[['name','Nama A–Z'],['sku','Kode A–Z'],['stock','Stok terendah'],['loc','Lokasi'],['created_desc','Waktu dimasukkan (terbaru)'],['created_asc','Waktu dimasukkan (terlama)']].map(o=>`<option value="${o[0]}" ${F.sort===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>
  ${F.q||F.cat||F.st?`<button class="btn s" onclick="F={q:'',cat:'',st:'',sort:F.sort};render()">Reset Filter</button>`:''}
 </div>
 <p class="inventory-summary"><span class="b ok">Aman</span> di atas minimum &nbsp; <span class="b wa">Menipis</span> sama dengan/di bawah minimum &nbsp; <span class="b er">Habis</span> stok nol &nbsp;·&nbsp; Centang <b>Notif & Auto-Req</b> agar barang masuk Peringatan Stok & Auto Input Request saat menipis/habis.</p>
 <div class="card table-card"><div class="tw"><table><thead><tr><th>Kode</th><th>Nama Spare Part</th><th>Kategori</th><th>Lokasi</th><th class="r">Stok</th><th class="r">Minimum</th><th>Status</th><th class="c" title="Aktifkan/Matikan Notifikasi Habis/Menipis & Auto Input Request">Notif & Auto-Req</th><th>Aksi</th></tr></thead><tbody id="tb"></tbody></table></div><div id="cnt" class="table-meta"></div></div>`;
}

/** Barang setelah filter F (teks, kategori, status) dan urutan F.sort. Dipakai tabel dan laporan Export. */
function filteredInventoryItems(){
 const q=F.q.toLowerCase();
 const r=S.items.filter(i=>(!q||[i.sku,i.name,i.loc,i.sup].join(' ').toLowerCase().includes(q))&&(!F.cat||i.cat===F.cat)&&(!F.st||stat(i)[0]===F.st));
 const so={name:(a,b)=>a.name.localeCompare(b.name),stock:(a,b)=>a.stock-b.stock,loc:(a,b)=>a.loc.localeCompare(b.loc),sku:(a,b)=>skuCollator.compare(String(a.sku||''),String(b.sku||'')),created_desc:(a,b)=>(Date.parse(b.createdAt)||0)-(Date.parse(a.createdAt)||0),created_asc:(a,b)=>(Date.parse(a.createdAt)||0)-(Date.parse(b.createdAt)||0)}[F.sort];
 return r.sort(so||(()=>0));
}

/** Mengisi isi tabel (#tb) dan penghitung (#cnt) sesuai filter; tombol aksi disesuaikan peran. */
function drawTable(){
 let r=filteredInventoryItems();
 $('#tb').innerHTML=r.map(i=>{
  const notifOn=i.notify!==false;
  return `<tr><td><b>${esc(i.sku)}</b></td><td>${esc(i.name)}${i.sup?`<small>Supplier: ${esc(i.sup)}</small>`:''}${!notifOn?`<small style="color:var(--wa)">🔕 Notifikasi & Auto-Request Nonaktif</small>`:''}</td><td>${esc(i.cat)}</td><td>${esc(i.loc)}</td><td class="r"><b>${num(i.stock)}</b> ${esc(i.unit)}${pendQty(i.id)>0?`<small>+${num(pendQty(i.id))} dalam PR</small>`:''}</td><td class="r">${num(i.min)}</td><td>${badge(i)}</td>
  <td class="c">
   <label class="chk-wrap" title="${notifOn?'Notifikasi Aktif: Masuk Peringatan Stok & Auto Input Request saat menipis/habis':'Notifikasi Nonaktif: Tidak masuk Peringatan Stok & Auto Input Request'}">
    <input type="checkbox" ${notifOn?'checked':''} onchange="toggleItemNotify('${i.id}',this.checked)">
    <span style="color:var(--${notifOn?'ok':'mt'})">${notifOn?'Aktif':'Mati'}</span>
   </label>
  </td>
  <td><div class="act-group">
   <button class="btn s p" title="Pesan / Request Sparepart" onclick="quickReq('${i.id}')">🛒 Pesan</button>
   ${currentUser!=='supervisor'?`<button class="btn s ok" title="Catat Barang Masuk" onclick="quickTx('${i.id}','in')">＋ Masuk</button>
   <button class="btn s d" title="Catat Barang Keluar" onclick="quickTx('${i.id}','out')" ${i.stock<=0?'disabled style="opacity:.4;cursor:not-allowed"':''}>－ Keluar</button>`:''}
   ${currentUser==='user'?`<button class="btn s" onclick="edit('${i.id}')">Edit</button>
   <button class="btn s d" onclick="delItem('${i.id}')">${pend===i.id?'Yakin?':'Hapus'}</button>`:''}
  </div></td></tr>`;
 }).join('')||'<tr><td colspan="10" class="mt">Tidak ada data yang cocok dengan filter</td></tr>';
 $('#cnt').textContent=r.length+' dari '+S.items.length+' item ditampilkan';
}

/** Mengaktifkan/mematikan notifikasi stok menipis/habis & keikutsertaan dalam Auto Input Request. */
function toggleItemNotify(id,isChecked){
 const it=findById(id);
 if(!it)return;
 it.notify=Boolean(isChecked);
 save();
 toast(it.notify?`🔔 Notifikasi & Auto Input untuk "${it.name}" diaktifkan`:`🔕 Notifikasi & Auto Input untuk "${it.name}" dimatikan`);
 if(V==='list')drawTable();
 else render();
}

/** Membuka form Master Barang untuk mengedit barang. Hanya user. */
function edit(id){
 if(currentUser!=='user')return toast('Akses ditolak! Hanya User utama yang dapat mengedit master barang.');
 editId=id;V='master';renderNav();render();scrollTo(0,0);
}

/** Hapus barang dengan konfirmasi dua klik. Ditolak bila barang masih ada di draft/Form PR. Hanya user. */
function delItem(id){
 if(currentUser!=='user')return toast('Akses ditolak! Hanya User utama yang dapat menghapus master barang.');
 const usedIn=itemUsageRef(id);
 if(usedIn)return toast('Tidak dapat dihapus: barang masih ada di '+usedIn+'. Selesaikan atau hapus dulu.');
 if(pend===id){S.items=S.items.filter(i=>i.id!==id);pend=null;save();toast('Suku cadang dihapus');drawTable()}else{pend=id;drawTable();setTimeout(()=>{if(pend===id){pend=null;if(V==='list')drawTable()}},3000)}
}

/* ==========================================================================
   [12] FITUR: MASTER BARANG (tambah / edit)
   --------------------------------------------------------------------------
   Tujuan   : Form menambah barang baru atau mengedit barang yang ada.
   Menu     : tab "master" -> vForm() (diakses dari menu Master, atau tombol Edit di tabel).
   Akses    : user = tambah & edit; supervisor = hanya tambah; admin = tidak ada.
   Data     : S.items, S.tx.
   Aturan   : kode (sku) unik. Barang baru dengan stok > 0 membuat transaksi "Stok awal" (isInit).
              Mengubah stok saat edit membuat transaksi penyesuaian (isAdj).
   Kode otomatis: memilih kategori mengisi kode berikutnya (mis. MEK-004) lewat nextCode().
   Cara ubah: Field baru -> ikuti panduan "Menambah field pada barang" (dokumentasi bagian 8B).
   ========================================================================== */

/** Tampilan form Master Barang (mode tambah bila editId null, mode edit bila terisi). */
function vForm(){
 if(currentUser!=='user'&&!(currentUser==='supervisor'&&!editId))return `<div class="card" style="padding:24px;text-align:center"><h3 style="color:var(--er)">Akses Dibatasi</h3><p class="mt">Akun ${ACCOUNTS[currentUser].name} tidak memiliki izin mengakses registrasi master barang baru.</p><button class="btn p" onclick="go('list')">Kembali ke Daftar Inventori</button></div>`;
 const i=editId?S.items.find(x=>x.id===editId):{},v=k=>esc(i[k]??'');
 const notifOn=i.notify!==false;
 const f=(id,l,t,k,x='')=>`<div><label for="f_${id}">${l}</label><input id="f_${id}" type="${t}" value="${v(k)}" ${x}></div>`;
 return `<div class="page-head"><div><h2>${editId?'Edit Master Spare Part':'Registrasi Master Spare Part Baru'}</h2><p class="page-subtitle">${editId?'Perubahan jumlah stok pada menu ini akan otomatis tercatat sebagai transaksi penyesuaian (adjustment).':'Gunakan form ini untuk mendaftarkan kode spare part baru ke dalam sistem.'}${currentUser==='supervisor'?' Supervisor dapat menambahkan barang baru; pengeditan dan penghapusan master tetap khusus User utama.':''}</p></div><div class="page-actions"><button class="btn p" onclick="go('in')">Ke Form Restock (Barang Masuk) →</button></div></div><div class="card form-card"><div class="fm">
 <div class="form-section-title">Identitas Spare Part</div>
 ${f('sku',editId?'Kode Spare Part *':'Kode Spare Part (otomatis)','text','sku',editId?'':'readonly placeholder="Pilih kategori terlebih dahulu"')}${f('name','Nama Spare Part *','text','name','placeholder="Masukkan nama komponen"')}
 <div><label for="f_catsel">Kategori *</label><select id="f_catsel" onchange="catChg()"><option value="">— Pilih kategori —</option>${cats().map(c=>`<option ${i.cat===c?'selected':''}>${esc(c)}</option>`).join('')}<option value="__new">+ Kategori baru…</option></select><input id="f_cat" placeholder="Nama kategori baru" style="display:none;margin-top:8px" oninput="catChg()"></div>
 ${f('sup','Supplier','text','sup','placeholder="Nama supplier (opsional)"')}
 <div class="form-section-title">Lokasi & Parameter Persediaan</div>
 ${f('loc','Lokasi Rak','text','loc','placeholder="Contoh: A-01 / WH-02"')}${f('unit','Satuan','text','unit','placeholder="pcs, unit, liter, kg"')}
 ${f('stock',editId?'Stok Saat Ini (Koreksi Fisik)':'Stok Awal','text','stock','inputmode="decimal" oninput="cleanDec(this)"')}${f('min','Stok Minimum','text','min','inputmode="decimal" oninput="cleanDec(this)"')}
 <div style="grid-column:1/-1;margin-top:4px;padding:10px 12px;background:var(--sf2);border:1px solid var(--bd);border-radius:8px">
  <label class="chk-wrap" style="font-size:13px;color:var(--tx)">
   <input type="checkbox" id="f_notify" ${notifOn?'checked':''}>
   <span>Aktifkan Notifikasi Peringatan Stok Habis / Menipis & Sertakan dalam Auto Input Request Sparepart</span>
  </label>
  <small class="mt" style="display:block;margin-top:4px;margin-left:26px">Jika ceklis dimatikan, spare part ini tidak akan muncul di Peringatan Stok Dashboard dan tidak akan dimasukkan otomatis saat tombol Auto Input Stok Kritis ditekan.</small>
 </div>
 </div><div class="form-actions"><button class="btn p" onclick="saveItem()">Simpan Master Data</button><button class="btn" onclick="go('list')">Batal</button></div></div>`;
}

/** Nilai kategori yang dipilih; bila "kategori baru" ambil dari kolom teks. */
function catVal(){const s=$('#f_catsel').value;return s==='__new'?$('#f_cat').value.trim():s}

/** Saat kategori diganti: tampilkan/sembunyikan kolom kategori baru dan isi kode otomatis (hanya mode tambah). */
function catChg(){const s=$('#f_catsel').value;$('#f_cat').style.display=s==='__new'?'':'none';if(!editId)$('#f_sku').value=nextCode(catVal())}

/** Membuat kode barang berikutnya untuk sebuah kategori: awalan yang paling umum di kategori itu (atau 3 huruf dari nama kategori) + nomor urut 3 digit, contoh MEK-004. */
function nextCode(c){
 if(!c)return'';
 const cnt={};S.items.filter(i=>i.cat===c).forEach(i=>{const p=i.sku.split('-')[0];cnt[p]=(cnt[p]||0)+1});
 const p=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]||(c.replace(/[^A-Za-z]/g,'').toUpperCase()+'XXX').slice(0,3);
 let m=0;S.items.forEach(i=>{const x=i.sku.match(/^(.*)-(\d+)$/);if(x&&x[1]===p)m=Math.max(m,+x[2])});
 let n=m+1,code;do{code=p+'-'+String(n).padStart(3,'0');n++}while(S.items.some(i=>i.sku===code));return code;
}

/**
 * Validasi lalu menyimpan barang baru / perubahan. Menolak kode ganda; mencatat transaksi stok awal atau penyesuaian.
 * Setelah sukses pindah ke Daftar Suku Cadang.
 */
function saveItem(){
 if(currentUser!=='user'&&!(currentUser==='supervisor'&&!editId))return toast('Akses ditolak! Supervisor hanya dapat menambahkan master barang baru, bukan mengubah barang yang sudah ada.');
 // Field harga sudah dihapus dari form Update 13; pembacaan field dibuat aman.
 const g=id=>{const el=$('#f_'+id);return el?el.value.trim():''};
 const oldItem=editId?S.items.find(x=>x.id===editId):null;
 const notifyEl=$('#f_notify');
 const notifyVal=notifyEl?Boolean(notifyEl.checked):(oldItem?oldItem.notify!==false:true);
 const o={sku:g('sku'),name:g('name'),cat:catVal(),loc:g('loc'),unit:g('unit')||'pcs',stock:Math.max(0,parseDec(g('stock'))),min:Math.max(0,parseDec(g('min'))),price:oldItem?(Number(oldItem.price)||0):0,sup:g('sup'),notify:notifyVal};
 if(!o.sku||!o.name||!o.cat)return toast('Pilih kategori dan isi nama suku cadang');
 if(S.items.some(i=>i.sku===o.sku&&i.id!==editId))return toast('Kode sudah dipakai oleh barang lain');
 if(editId){
  const existing=S.items.find(i=>i.id===editId);
  if(!existing){editId=null;return toast('Data barang yang akan diedit tidak ditemukan. Muat ulang halaman lalu coba kembali.');}
  const diff=r3(o.stock-(Number(existing.stock)||0));
  Object.assign(existing,o);
  if(diff!==0){
   S.tx.push({id:uid(),date:today(),time:wibTime(),item:existing.id,type:diff>0?'in':'out',qty:r3(Math.abs(diff)),pic:actor(),by:currentUser,isAdj:true,note:'Penyesuaian stok manual (Edit Master)'});
  }
 }else{
  const n={id:uid(),...o,createdAt:new Date().toISOString()};
  S.items.push(n);
  if(n.stock>0){
   S.tx.push({id:uid(),date:today(),time:wibTime(),item:n.id,type:'in',qty:n.stock,pic:actor(),by:currentUser,note:'Stok awal',isInit:true});
  }
 }
 save();toast('Master suku cadang tersimpan');go('list');
}

/* ==========================================================================
   [13] FITUR: SUKU CADANG MASUK & KELUAR (+ riwayatnya)
   --------------------------------------------------------------------------
   Tujuan   : Mencatat barang masuk (penerimaan manual) dan keluar (pengambilan oleh PIC),
              lengkap dengan riwayat dan laporan PDF.
   Menu     : tab "in" dan "out" -> vTx('in'|'out'). Akses: user & admin (supervisor ditolak).
   Aturan   : keluar > stok ditolak; barang keluar wajib PIC terdaftar di Master PIC;
              membatalkan transaksi masuk ditolak bila stok sekarang lebih kecil; transaksi hasil
              penerimaan PR tidak bisa dihapus dari sini (batalkan lewat Proses Request).
   Data     : S.items (stok berubah), S.tx. Filter periode di RG, batas baris tampil di LIM.
   Alur     : isi form -> saveTx() -> stok & riwayat diperbarui -> go(type).
   Cara ubah: Kolom riwayat -> vTx(). Aturan validasi -> saveTx(). Laporan PDF riwayat -> expPDF().
   ========================================================================== */

/** Filter periode riwayat per jenis: {p:"all"|"1"|"3"|"6"|"12"|"c" (bulan / custom), from, to}. */
const RG={in:{p:'all',from:'',to:''},out:{p:'all',from:'',to:''}};

/** Batas jumlah baris riwayat yang ditampilkan (rec = Transaksi Terakhir, in, out); default 100. */
const LIM={rec:100,in:100,out:100};

/** Daftar pemeriksaan transaksi sementara; stok belum berubah sampai tombol konfirmasi ditekan. */
const TXQ={in:[],out:[]};
/* Antrean pemeriksaan (TXQ & OPQ) disimpan di localStorage agar tidak hilang saat halaman dimuat ulang. */
const QUEUE_KEY='wh_queue_v1';
function qSave(){try{localStorage.setItem(QUEUE_KEY,JSON.stringify({txq:TXQ,opq:OPQ}))}catch(e){}}
function qLoad(){
 try{
  const v=JSON.parse(localStorage.getItem(QUEUE_KEY)||'null');
  if(!v)return;
  if(v.txq&&Array.isArray(v.txq.in)&&Array.isArray(v.txq.out)){TXQ.in=v.txq.in;TXQ.out=v.txq.out}
  if(Array.isArray(v.opq))OPQ=v.opq;
 }catch(e){}
}

/** Rentang tanggal [dari, sampai] aktif untuk riwayat sesuai RG. */
/** Tanggal WIB n bulan yang lalu. Bila tanggal tidak ada di bulan tujuan, dipakai hari terakhir bulan itu (31 Maret -> 28/29 Februari). */
function monthsAgo(n){
 const [y,m,d]=today().split('-').map(Number);
 const last=new Date(Date.UTC(y,m-1-n+1,0)).getUTCDate();
 return new Date(Date.UTC(y,m-1-n,Math.min(d,last))).toISOString().slice(0,10);
}

function rng(ty){
 const r=RG[ty];
 if(r.p==='all')return['',''];
 if(r.p==='c'){let a=r.from,b=r.to;if(a&&b&&a>b){const z=a;a=b;b=z}return[a,b]}
 return[monthsAgo(+r.p),today()];
}

/** Daftar transaksi suatu jenis dalam rentang RG, terbaru di atas. */
function hist(ty){
 const[f,t]=rng(ty);
 return S.tx.filter(x=>x.type===ty&&(!f||x.date>=f)&&(!t||x.date<=t)).reverse().sort((a,b)=>(b.date+(b.time||'')).localeCompare(a.date+(a.time||'')));
}

/** Toolbar riwayat: pilihan periode, tanggal custom, jumlah data, dan tombol PDF. */
function hbar(ty){
 const r=RG[ty],n=hist(ty).length,[f,t]=rng(ty);
 return `<div class="tb"><select onchange="setRG('${ty}','p',this.value)">${[['all','Semua periode'],['1','1 Bulan Terakhir'],['3','3 Bulan Terakhir'],['6','6 Bulan Terakhir'],['12','1 Tahun Terakhir'],['c','Atur Tanggal']].map(o=>`<option value="${o[0]}" ${r.p===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>${r.p==='c'?`<span class="mt" style="align-self:center">Dari</span><input type="date" value="${r.from}" onchange="setRG('${ty}','from',this.value)"><span class="mt" style="align-self:center">sampai</span><input type="date" value="${r.to}" onchange="setRG('${ty}','to',this.value)">`:''}<button class="btn p" onclick="expPDF('${ty}')">🖨️ Export PDF</button></div><div class="mt" style="font-size:12px;margin-bottom:6px">${n} transaksi${f||t?' · periode '+(f||'awal')+' s/d '+(t||'sekarang'):''}${n>LIM[ty]?' · tabel menampilkan '+LIM[ty]+' terbaru, PDF memuat semuanya':''}</div>`;
}

/** Mengubah filter periode lalu menggambar ulang riwayat saja (tanpa render penuh). */
function setRG(ty,k,v){RG[ty][k]=v;LIM[ty]=100;drawHist(ty)}

/** Menggambar ulang toolbar (#hb) dan baris riwayat (#hrows) dari vTx(). */
function drawHist(ty){
 const d=document.createElement('div');
 d.innerHTML=vTx(ty);
 $('#hb').innerHTML=d.querySelector('#hb').innerHTML;
 $('#hrows').innerHTML=d.querySelector('#hrows').innerHTML;
}

/** Membuka jendela cetak (PDF) untuk riwayat masuk/keluar pada periode terpilih. Perlu izin pop-up. */
function expPDF(ty){
 const H=hist(ty),[f,t]=rng(ty),title='Riwayat Suku Cadang '+(ty==='in'?'Masuk':'Keluar');
 const w=window.open('','_blank');
 if(!w){toast('Izinkan pop-up browser untuk mencetak PDF');return}
 const rows=H.map(x=>{
  const i=findById(x.item)||{};
  return `<tr><td>${esc(x.date)}${x.time?' '+esc(x.time):''}</td><td>${esc(i.sku||'-')}</td><td>${esc(nm(x.item))}</td><td class="num">${num(x.qty)} ${esc(i.unit||'')}</td><td>${esc(x.pic||'-')}</td><td>${esc(x.note||'-')}</td></tr>`;
 }).join('');
 w.document.write(`<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>${title}</title><style>
 @page{size:A4 portrait;margin:14mm}*{box-sizing:border-box}body{font:12px Arial,sans-serif;color:#202938;margin:0}
 h1{font-size:18px;margin:0 0 4px}p{font-size:11px;color:#5d6878;margin:0 0 14px}
 table{width:100%;border-collapse:collapse}th,td{border:1px solid #cbd3df;padding:7px 9px;text-align:left}th{background:#eef2f7;font-weight:700}td.num{text-align:right;font-variant-numeric:tabular-nums}
 tbody tr:nth-child(even){background:#f8fafc}
 </style></head><body><h1>${title}</h1><p>Periode: ${f||t?(f||'awal')+' s/d '+(t||'sekarang'):'Semua periode'} &nbsp;|&nbsp; Dicetak: ${today()} ${wibTime()} WIB &nbsp;|&nbsp; Total Transaksi: ${H.length}</p>
 <table><thead><tr><th>Tanggal & Jam (WIB)</th><th>Kode</th><th>Nama Suku Cadang</th><th>Jumlah</th><th>${ty==='in'?'PIC Penerima':'PIC Pengambil'}</th><th>Catatan</th></tr></thead><tbody>${rows||'<tr><td colspan="6" style="text-align:center;padding:16px">Tidak ada transaksi pada periode ini</td></tr>'}</tbody></table>
 <script>window.onload=()=>{window.focus();window.print()}<\/script></body></html>`);
 w.document.close();
}

/** Tampilan form + riwayat untuk barang masuk/keluar. Supervisor mendapat pesan "Akses Dibatasi". */
function vTx(ty){
 if(currentUser==='supervisor')return `<div class="card" style="padding:24px;text-align:center"><h3 style="color:var(--er)">Akses Dibatasi</h3><p class="mt">Akun Supervisor tidak diizinkan menginput transaksi barang masuk atau keluar.</p><button class="btn p" onclick="go('dash')">Kembali ke Dashboard</button></div>`;
 const hAll=hist(ty);
 const rows=hAll.slice(0,LIM[ty]).map(t=>{
  const i=findById(t.item)||{};
  return `<tr><td>${esc(t.date)}<small>${t.time?esc(t.time)+' WIB':'-'}</small></td><td><b>${esc(i.sku||'-')}</b> · ${esc(nm(t.item))}</td><td><span class="b ${t.type==='in'?'ok':'er'}">${t.type==='in'?'Terima':'Pakai'}</span></td><td class="r"><b>${num(t.qty)}</b> ${esc(i.unit||'')}</td><td><b>${esc(t.pic||'-')}</b>${t.picTitle?`<small>${esc(t.picTitle)}</small>`:''}${t.by?`<small>Input: ${esc(t.by)}</small>`:''}</td><td>${esc(t.note||'-')}</td><td><button class="btn s d" onclick="delTx('${t.id}',()=>drawHist('${ty}'))">${pend==='tx_'+t.id?'Yakin Batal?':'Batal'}</button></td></tr>`;
 }).join('')||'<tr><td colspan="7" class="mt">Belum ada transaksi</td></tr>';
 const moreRow=hAll.length>LIM[ty]?`<tr><td colspan="7" class="c"><button class="btn s" onclick="LIM['${ty}']+=100;drawHist('${ty}')">Tampilkan 100 lagi (${LIM[ty]} dari ${hAll.length})</button></td></tr>`:'';
 return `<div class="page-head"><div><h2>${ty==='in'?'➕ Suku Cadang Masuk (Restock)':'➖ Suku Cadang Keluar (Pemakaian)'}</h2><p class="page-subtitle">${ty==='in'?'Tambahkan beberapa sparepart ke daftar pemeriksaan, periksa kembali, lalu konfirmasi untuk menambah stok.':'Tambahkan beberapa sparepart beserta PIC ke daftar pemeriksaan, periksa kembali, lalu konfirmasi untuk mengurangi stok.'}</p></div>${ty==='in'?`<div class="page-actions"><button class="btn" onclick="go('proc')">⏳ Cek Penerimaan dari Proses Request</button>${currentUser==='user'?'<button class="btn" onclick="go(\'master\')">+ Buat Master Baru</button>':''}</div>`:''}</div>
 <div class="card"><div class="fm">
  <div><label>Suku Cadang (ketik nama atau kode) *</label><input id="t_item" list="tl" placeholder="mis. bearing atau MEK-001" autocomplete="off" oninput="txInfo()"><datalist id="tl">${S.items.map(i=>`<option value="${esc(i.sku)} · ${esc(i.name)}">Stok: ${num(i.stock)} ${esc(i.unit)} (${stat(i)[0]})</option>`).join('')}</datalist><div id="t_info" class="mt" style="font-size:12px;margin-top:4px"></div></div>
  <input id="t_type" type="hidden" value="${ty}">
  <div><label>Jumlah *</label><input id="t_qty" type="text" inputmode="decimal" oninput="cleanDec(this)" placeholder="Ketik jumlah…"></div>
  <div><label>${ty==='out'?'PIC Pengambilan Barang *':'PIC Penerima Barang *'}</label>${`<select id="t_pic"><option value="">-- Pilih PIC --</option>${(S.pics||[]).filter(p=>p.active!==false).map(p=>`<option value="${esc(p.name)}">${esc(p.name)}${p.title?' — '+esc(p.title):''}</option>`).join('')}</select><small class="mt">Admin hanya dapat memilih PIC yang telah didaftarkan User/Supervisor.</small>`}</div>
  <div><label>Catatan (No. PO / Work Order / Mesin)</label><input id="t_note" placeholder="${ty==='in'?'Contoh: PO-2026-089 dari Supplier':'Contoh: WO-104 Perbaikan Mesin Welding Line 2'}"></div>
  <div><label>Tanggal (WIB)</label><input id="t_date" type="date" value="${today()}"></div>
  <div><label>Waktu (WIB)</label><input id="t_time" type="time" value="${wibTime()}"></div>
 </div>
 <div style="margin-top:16px"><button class="btn ${ty==='in'?'p':'d'}" onclick="addTxToQueue()">${ty==='in'?'＋ Tambahkan ke Daftar Barang Masuk':'＋ Tambahkan ke Daftar Barang Keluar'}</button></div></div>
 <div id="txQueue" style="margin-top:14px">${txQueueHtml(ty)}</div>
 <div class="card tw" style="margin-top:14px"><h3>Riwayat ${ty==='in'?'Masuk':'Keluar'}</h3><div id="hb">${hbar(ty)}</div><table><thead><tr><th>Tanggal & Jam</th><th>Suku Cadang</th><th>Jenis</th><th class="r">Jumlah</th><th>${ty==='in'?'PIC Penerima':'PIC Pengambil'}</th><th>Catatan</th><th>Aksi</th></tr></thead><tbody id="hrows">${rows}${moreRow}</tbody></table></div>`;
}

/** Mencari barang dari teks pilihan form ("SKU · Nama", SKU, atau nama). */
function findItem(s){
 s=s.trim().toLowerCase();if(!s)return null;
 const m=S.items.filter(i=>(i.sku+' · '+i.name).toLowerCase()===s||i.sku.toLowerCase()===s||i.name.toLowerCase()===s);
 if(m.length===1)return m[0];
 const p=S.items.filter(i=>(i.sku+' '+i.name).toLowerCase().includes(s));return p.length===1?p[0]:null;
}

/** Menampilkan info stok/satuan barang yang dipilih di form transaksi. */
function txInfo(){
 const i=findItem($('#t_item').value);
 $('#t_info').innerHTML=i?`Stok saat ini: <b>${num(i.stock)} ${esc(i.unit)}</b> · Minimum: ${num(i.min)} · Lokasi: ${esc(i.loc)} · ${badge(i)}`:'';
}

/**
 * Membuat tampilan daftar pemeriksaan. Menambahkan barang ke daftar belum mengubah stok.
 */
function txQueueHtml(ty){
 const q=TXQ[ty]||[];
 const total=q.reduce((s,x)=>s+x.qty,0);
 const rows=q.map((x,n)=>{
  const it=findById(x.item)||{};
  return `<tr>
   <td>${n+1}</td><td><b>${esc(it.sku||'-')}</b><small>${esc(it.name||'-')}</small></td>
   <td class="r"><b>${num(x.qty)}</b> ${esc(it.unit||'')}</td>
   <td>${esc(x.pic||'-')}${x.picTitle?`<small>${esc(x.picTitle)}</small>`:''}</td>
   <td>${esc(x.date)}<small>${esc(x.time||'-')} WIB</small></td>
   <td>${esc(x.note||'-')}</td>
   <td><button class="btn s d" onclick="removeTxQueueItem('${ty}',${n})">Hapus</button></td>
  </tr>`;
 }).join('');
 return `<div class="card">
  <div class="row" style="justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
   <div><h3>📋 Daftar Pemeriksaan Barang ${ty==='in'?'Masuk':'Keluar'}</h3>
    <p class="mt">Periksa seluruh barang terlebih dahulu. Stok dan riwayat belum berubah sebelum konfirmasi akhir.</p></div>
   <span class="b ${ty==='in'?'ok':'er'}">${q.length} baris · Total ${num(total)}</span>
  </div>
  ${q.length?`<div class="tw" style="margin-top:10px"><table><thead><tr><th>No.</th><th>Barang</th><th class="r">Jumlah</th><th>PIC</th><th>Tanggal & Jam</th><th>Catatan</th><th>Aksi</th></tr></thead><tbody>${rows}</tbody></table></div>
   <div class="form-actions" style="margin-top:14px;justify-content:flex-end">
    <button class="btn" onclick="clearTxQueue('${ty}')">Kosongkan Daftar</button>
    <button class="btn ${ty==='in'?'p':'d'}" onclick="commitTxQueue('${ty}')">${ty==='in'?'✓ Konfirmasi & Simpan Semua Barang Masuk':'✓ Konfirmasi & Simpan Semua Barang Keluar'} (${q.length} barang)</button>
   </div>`:`<div class="mt" style="padding:16px;text-align:center;border:1px dashed var(--bd);border-radius:10px;margin-top:10px">Belum ada barang dalam daftar. Tambahkan barang dari formulir di atas.</div>`}
 </div>`;
}

/** Tambahkan satu baris transaksi ke daftar pemeriksaan, tanpa mengubah stok. */
function addTxToQueue(){
 if(currentUser==='supervisor')return toast('Akses ditolak! Supervisor tidak dapat menginput transaksi.');
 const type=$('#t_type').value;
 if(type!=='in'&&type!=='out')return toast('Jenis transaksi tidak valid.');
 const it=findItem($('#t_item').value),q=r3(parseDec($('#t_qty').value));
 const pic=($('#t_pic')?.value||'').trim();
 if(!it)return toast('Suku cadang tidak ditemukan, pilih dari daftar yang muncul.');
 if(!(q>0))return toast('Isi jumlah lebih dari 0.');
 if(!pic)return toast(type==='out'?'Pilih PIC Pengambilan Barang dari daftar.':'Pilih PIC Penerima Barang dari daftar.');
 if(!findPic(pic))return toast('PIC tidak valid. Pilih PIC yang terdaftar pada Master PIC.');
 if(type==='out'){
  const queued=TXQ.out.filter(x=>x.item===it.id).reduce((s,x)=>s+x.qty,0);
  if(queued+q>it.stock)return toast('Jumlah melebihi stok tersedia setelah memperhitungkan barang yang sudah ada di daftar. Stok: '+num(it.stock)+' '+it.unit+'.');
 }
 TXQ[type].push({
  item:it.id,qty:q,pic:pic||(type==='in'?'Admin Gudang':'-'),
  picTitle:findPic(pic)?.title||'',
  by:currentUser,note:$('#t_note').value.trim(),
  date:$('#t_date').value||today(),time:$('#t_time')?.value||wibTime()
 });
 qSave();toast('Barang ditambahkan ke daftar pemeriksaan. Stok belum berubah.');
 $('#t_item').value='';$('#t_qty').value='';$('#t_note').value='';
 if($('#t_info'))$('#t_info').innerHTML='';
 drawTxQueue(type);
}

/** Hapus satu baris dari daftar pemeriksaan. */
function removeTxQueueItem(ty,index){
 if(!TXQ[ty]||index<0||index>=TXQ[ty].length)return;
 TXQ[ty].splice(index,1);drawTxQueue(ty);
}

/** Kosongkan daftar pemeriksaan tanpa mengubah stok. */
function clearTxQueue(ty){
 if(!TXQ[ty]||!TXQ[ty].length)return;
 TXQ[ty]=[];drawTxQueue(ty);toast('Daftar pemeriksaan dikosongkan. Stok tidak berubah.');
}

/** Gambar ulang panel daftar saja; formulir dan isian yang sedang diketik tidak terganggu. */
function drawTxQueue(ty){
 qSave();
 const el=$('#txQueue');if(el)el.innerHTML=txQueueHtml(ty);
}

/**
 * Validasi ulang seluruh daftar lalu simpan sebagai satu proses.
 * Jika satu baris tidak valid, tidak ada stok atau riwayat yang diubah.
 */
function commitTxQueue(ty){
 if(currentUser==='supervisor')return toast('Akses ditolak! Supervisor tidak dapat menginput transaksi.');
 const q=TXQ[ty]||[];
 if(!q.length)return toast('Daftar pemeriksaan masih kosong.');
 const totals={};
 for(const x of q){
  const it=findById(x.item);
  if(!it)return toast('Ada barang dalam daftar yang sudah tidak ditemukan di Master Barang. Hapus baris tersebut lalu periksa kembali.');
  if(!(x.qty>0))return toast('Ada jumlah barang yang tidak valid. Periksa daftar.');
  if(ty==='out'){
   if(!findPic(x.pic))return toast('PIC '+(x.pic||'')+' tidak lagi valid. Periksa daftar dan Master PIC.');
   totals[x.item]=(totals[x.item]||0)+x.qty;
  }
 }
 if(ty==='out'){
  for(const id of Object.keys(totals)){
   const it=findById(id);
   if(!it||totals[id]>it.stock)return toast('Konfirmasi dibatalkan: total '+(it?.name||'barang')+' dalam daftar ('+num(totals[id])+' '+(it?.unit||'')+') melebihi stok tersedia ('+num(it?.stock||0)+' '+(it?.unit||'')+').');
  }
 }
 // Semua validasi lolos; baru terapkan stok dan histori.
 q.forEach(x=>{
  const it=findById(x.item);
  it.stock=r3(it.stock+(ty==='in'?x.qty:-x.qty));
  S.tx.push({id:uid(),date:x.date||today(),time:x.time||wibTime(),item:x.item,type:ty,qty:x.qty,
   pic:x.pic|| (ty==='in'?'Admin Gudang':'-'),picTitle:x.picTitle||'',by:x.by||currentUser,note:x.note||''});
 });
 const count=q.length;TXQ[ty]=[];
 save();toast(count+' baris barang '+(ty==='in'?'masuk':'keluar')+' berhasil dikonfirmasi dan disimpan.');
 go(ty);
}

/**
 * Membatalkan transaksi dengan konfirmasi dua klik dan mengembalikan stok.
 * Ditolak untuk supervisor, transaksi asal PR, dan bila pembatalan membuat stok negatif.
 * @param rerenderFn fungsi untuk menggambar ulang halaman pemanggil.
 */
function delTx(txId,rerenderFn){
 if(currentUser==='supervisor')return toast('Akses ditolak! Supervisor tidak dapat menghapus riwayat transaksi.');
 const lk=prLinkOfTx(txId);
 if(lk)return toast('Transaksi ini berasal dari Form '+lk+'. Batalkan lewat ceklis penerimaan di menu Proses Request.');
 if(pend!=='tx_'+txId){
  pend='tx_'+txId;
  rerenderFn();
  setTimeout(()=>{if(pend==='tx_'+txId){pend=null;rerenderFn()}},3000);
  return;
 }
 pend=null;
 const idx=S.tx.findIndex(x=>x.id===txId);
 if(idx<0)return;
 const t=S.tx[idx];
 const it=findById(t.item);
 if(it){
  if(t.type==='in'){
   if(it.stock<t.qty)return toast('Gagal batal: stok saat ini lebih kecil dari transaksi masuk tersebut');
   it.stock=r3(it.stock-t.qty);
  }else{
   it.stock=r3(it.stock+t.qty);
  }
 }
 S.tx.splice(idx,1);
 save();
 toast('Transaksi dibatalkan & stok dikembalikan');
 rerenderFn();
}

/* ==========================================================================
   [14] FITUR: TRANSAKSI TERAKHIR (log gabungan)
   --------------------------------------------------------------------------
   Tujuan   : Log semua transaksi (masuk, keluar, penyesuaian) dengan pencarian & filter.
   Menu     : tab "tx" -> vRecent(). Akses: semua peran melihat; hapus = bukan supervisor.
   Paginasi : tombol "tampilkan lebih banyak" menambah LIM.rec sebanyak 100 baris.
   Data     : S.tx; filter di RF; batas tampil LIM.rec.
   Export   : tombol CSV -> expCSV('tx') (bagian 19).
   ========================================================================== */

/** Tampilan log transaksi gabungan dengan filter jenis, tanggal, dan pencarian (RF). */
function vRecent(){
 const q=RF.q.toLowerCase();
 const all=[...S.tx].reverse().sort((a,b)=>(b.date+(b.time||'')).localeCompare(a.date+(a.time||''))).filter(t=>{
  if(RF.type&&t.type!==RF.type)return false;
  if(RF.from&&t.date<RF.from)return false;
  if(RF.to&&t.date>RF.to)return false;
  if(q){
   const i=findById(t.item)||{};
   const hay=[i.sku||'',nm(t.item),t.pic||'',t.note||'',t.date].join(' ').toLowerCase();
   if(!hay.includes(q))return false;
  }
  return true;
 });
 const rows=all.slice(0,LIM.rec).map(t=>{
  const i=findById(t.item)||{};
  return `<tr><td>${esc(t.date)}<small>${t.time?esc(t.time)+' WIB':'-'}</small></td><td><b>${esc(i.sku||'-')}</b></td><td>${esc(nm(t.item))}</td><td><span class="b ${t.type==='in'?'ok':'er'}">${t.type==='in'?'Masuk':'Keluar'}</span></td><td class="r"><b>${num(t.qty)}</b> ${esc(i.unit||'')}</td><td><b>${esc(t.pic||'-')}</b>${t.picTitle?`<small>${esc(t.picTitle)}</small>`:''}${t.by?`<small>Input: ${esc(t.by)}</small>`:''}</td><td>${esc(t.note||'-')}</td><td>${currentUser!=='supervisor'?`<button class="btn s d" onclick="delTx('${t.id}',render)">${pend==='tx_'+t.id?'Yakin Batal?':'Batal'}</button>`:'<small class="mt">Hanya Lihat</small>'}</td></tr>`;
 }).join('')||'<tr><td colspan="8" class="mt">Tidak ada transaksi yang cocok</td></tr>';
 const moreRow=all.length>LIM.rec?`<tr><td colspan="8" class="c"><button class="btn s" onclick="LIM.rec+=100;drawRecentBody()">Tampilkan 100 lagi (${LIM.rec} dari ${all.length})</button></td></tr>`:'';
 return `<div class="page-head"><div><h2>Transaksi Terakhir</h2><p class="page-subtitle">Pantau seluruh histori penerimaan, pemakaian, PIC pengambil, dan batalkan transaksi jika salah input.</p></div><div class="page-actions"><button class="btn" onclick="expCSV('tx')">📥 Export Transaksi (.csv)</button></div></div>
 <div class="tb">
  <input placeholder="Cari kode, nama barang, nama PIC, atau catatan WO/PO…" value="${esc(RF.q)}" oninput="RF.q=this.value;drawRecentBody()">
  <select onchange="RF.type=this.value;drawRecentBody()">${[['','Semua jenis'],['in','Suku Cadang Masuk'],['out','Suku Cadang Keluar']].map(o=>`<option value="${o[0]}" ${RF.type===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>
  <input type="date" value="${RF.from}" onchange="RF.from=this.value;drawRecentBody()" title="Dari tanggal">
  <input type="date" value="${RF.to}" onchange="RF.to=this.value;drawRecentBody()" title="Sampai tanggal">
  ${RF.q||RF.type||RF.from||RF.to?`<button class="btn s" onclick="RF={type:'',q:'',from:'',to:''};render()">Reset</button>`:''}
 </div>
 <div class="card table-card"><div class="tw"><table><thead><tr><th>Tanggal & Jam</th><th>Kode</th><th>Suku Cadang</th><th>Jenis</th><th class="r">Jumlah</th><th>PIC</th><th>Catatan</th><th>Aksi</th></tr></thead><tbody id="recBody">${rows}${moreRow}</tbody></table></div></div>`;
}

/** Menggambar ulang isi log saat filter berubah. */
function drawRecentBody(){
 const d=document.createElement('div');
 d.innerHTML=vRecent();
 $('#recBody').innerHTML=d.querySelector('#recBody').innerHTML;
}

 const rows=reqList.map((r,idx)=>{
  const it=findById(r.itemId);

  const unit=it?it.unit:(r.unit||'pcs');

  return `<tr>
   <td>${idx+1}</td>

   <td class="r">${num(curStock)}</td>
   <td class="r" style="width:130px"><input type="text" inputmode="decimal" value="${esc(r.qty)}" oninput="cleanDec(this)" style="text-align:right;padding:5px 8px;max-width:100px" onchange="updReqQty('${r.id}',this.value)"></td>
   <td>${esc(unit)}</td>
   <td><input type="text" placeholder="Ket. / Mesin (opsional)" value="${esc(r.note||'')}" style="padding:5px 8px;min-width:150px" onchange="updReqNote('${r.id}',this.value)"></td>
   <td><button class="btn s d" onclick="delReq('${r.id}')">Hapus</button></td>
  </tr>`;
 }).join('')||'<tr><td colspan="8" class="mt" style="text-align:center;padding:22px">Belum ada daftar sparepart yang ingin dipesan. Klik tombol <b>⚡ Auto Input Stok Kritis & Habis</b> di atas untuk memasukkan semua barang yang menipis/habis secara otomatis.</td></tr>';

 return `<div class="page-head">
  <div>
   <h2>🛒 Request Sparepart (Buat Form Pengajuan)</h2>
   <p class="page-subtitle">Susun daftar suku cadang yang ingin dipesan. Saat diekspor atau diajukan, daftar ini akan otomatis masuk ke tab <b>⏳ Proses Request</b>.</p>

   ${S.reqs.length?`<button class="btn d" onclick="clearReqs()">${pend==='clr_req'?'Yakin Kosongkan?':'🗑️ Kosongkan Daftar'}</button>`:''}
   <button class="btn ok" onclick="submitReqToProcess(false)">📋 Simpan ke Proses Request</button>

   <div>
    <label for="r_item">Nama Barang / Suku Cadang *</label>
    <input id="r_item" list="req_dl" placeholder="Ketik nama barang (mis. Bearing, Kontaktor, Sekring)…" autocomplete="off" oninput="reqInfo()">
    <datalist id="req_dl">${S.items.map(i=>`<option value="${esc(i.name)} (${esc(i.sku)})">Stok: ${num(i.stock)} ${esc(i.unit)} · ${stat(i)[0]}</option>`).join('')}</datalist>
   </div>
   <div>
    <label for="r_stock">Jumlah Stok Saat Ini</label>
    <input id="r_stock" type="text" readonly placeholder="Otomatis">
   </div>
   <div>
    <label for="r_qty">Jumlah Dipesan *</label>
    <input id="r_qty" type="text" inputmode="decimal" placeholder="Ketik jumlah…" oninput="cleanDec(this)" onkeydown="if(event.key==='Enter')addReqItem()">

  </div>
  <div id="r_hint" class="mt" style="font-size:12px;margin-top:8px"></div>
 </div>

 <div class="card table-card">

/** Mencari barang dari teks pilihan form request ("Nama (SKU)", SKU, atau nama). */
function findItemForReq(s){
 s=String(s||'').trim().toLowerCase();
 if(!s)return null;
 const exact=S.items.filter(i=>
  `${i.name} (${i.sku})`.toLowerCase()===s ||
  `${i.sku} · ${i.name}`.toLowerCase()===s ||
  i.name.toLowerCase()===s ||
  i.sku.toLowerCase()===s
 );
 if(exact.length===1)return exact[0];
 const part=S.items.filter(i=>`${i.name} ${i.sku}`.toLowerCase().includes(s));
 return part.length===1?part[0]:null;
}

/** Menampilkan info stok, status, dan PR berjalan untuk barang yang dipilih. */
function reqInfo(){
 const it=findItemForReq($('#r_item')?.value);
 const stEl=$('#r_stock'),unEl=$('#r_unit'),hintEl=$('#r_hint'),qtyEl=$('#r_qty');
 if(it){
  if(stEl)stEl.value=num(it.stock);
  if(unEl)unEl.value=it.unit;
  if(qtyEl&&!qtyEl.value){
   const sug=r3(Math.max(1,(Number(it.min)||1)-((Number(it.stock)||0)+pendQty(it.id))+5));
   qtyEl.value=it.stock<=it.min?sug:1;
  }
  if(hintEl)hintEl.innerHTML=`Kode: <b>${esc(it.sku)}</b> · Kategori: ${esc(it.cat)} · Lokasi: ${esc(it.loc)} · Stok Minimum: <b>${num(it.min)} ${esc(it.unit)}</b> · Status: ${badge(it)}${pendQty(it.id)>0?` · <b style="color:var(--wa)">⚠️ Sudah ada ${num(pendQty(it.id))} ${esc(it.unit)} dalam PR yang berjalan</b>`:''}`;
 }else{
  if(stEl)stEl.value='';
  if(unEl)unEl.value='';
  if(hintEl)hintEl.textContent='';
 }
}

/** Menambah barang ke draft; bila sudah ada jumlahnya dijumlahkan. Catatan otomatis "Stok Habis"/"Restock Stok Menipis". */
function addReqItem(){
 const it=findItemForReq($('#r_item')?.value);
 const q=parseDec($('#r_qty')?.value);
 if(!it)return toast('Pilih nama barang yang valid dari daftar suku cadang');
 if(!(q>0))return toast('Masukkan jumlah yang ingin dipesan (minimal 1)');
 if(!Array.isArray(S.reqs))S.reqs=[];
 const ex=S.reqs.find(r=>r.itemId===it.id);
 if(ex){
  ex.qty=r3(Number(ex.qty)+q);
  ex.stockSnapshot=it.stock;
  toast(`Jumlah pesanan "${it.name}" ditambahkan menjadi ${num(ex.qty)} ${it.unit}`);
 }else{
  S.reqs.push({
   id:uid(),
   itemId:it.id,
   sku:it.sku,
   name:it.name,
   stockSnapshot:it.stock,
   qty:q,
   unit:it.unit,
   note:it.stock<=0?'Stok Habis':(it.stock<=it.min?'Restock Stok Menipis':'')
  });
  toast(`"${it.name}" ditambahkan ke daftar pesanan`+(pendQty(it.id)>0?` ⚠️ Perhatian: sudah ada ${num(pendQty(it.id))} ${it.unit} dalam PR yang berjalan`:''));
 }
 save();
 renderNav();
 render();
 $('#r_item')?.focus();
}

/** Memasukkan semua barang Menipis/Habis ke draft dengan jumlah saran; melewati yang sudah di draft atau sudah tercakup PR berjalan. */
function autoInputCritical(){
 const allCrit=S.items.filter(i=>i.stock<=i.min);
 const crit=allCrit.filter(i=>i.notify!==false);
 const mutedCount=allCrit.length-crit.length;
 if(!crit.length)return toast(mutedCount>0?`Tidak ada barang yang dimasukkan (${mutedCount} sparepart kritis/habis dimatikan notifikasinya)`:'Semua stok dalam kondisi Aman (tidak ada stok menipis atau habis)');
 if(!Array.isArray(S.reqs))S.reqs=[];
 let added=0,skipped=0;
 crit.forEach(it=>{
  if(S.reqs.some(r=>r.itemId===it.id))return;
  const pq=pendQty(it.id),cur=Number(it.stock)||0,mn=Number(it.min)||0;
  if(cur+pq>mn){skipped++;return}
  S.reqs.push({
   id:uid(),itemId:it.id,sku:it.sku,name:it.name,stockSnapshot:it.stock,
   qty:r3(Math.max(1,(mn||1)-(cur+pq)+5)),unit:it.unit,
   note:it.stock<=0?'Stok Habis':'Restock Stok Menipis'
  });
  added++;
 });
 save();renderNav();render();
 const extraInfo=[skipped?`${skipped} sudah tercakup PR berjalan`:'',mutedCount?`${mutedCount} notif dimatikan`:''].filter(Boolean).join(', ');
 if(added>0)toast(`Berhasil auto-input ${added} sparepart kritis & habis!`+(extraInfo?` (${extraInfo})`:''));
 else toast(skipped?'Semua barang kritis sudah tercakup PR yang sedang berjalan':'Semua sparepart kritis yang aktif notifikasinya sudah ada di dalam daftar pesanan.');
}

/** Mengubah jumlah sebuah baris draft. */
function updReqQty(id,val){
 const r=(S.reqs||[]).find(x=>x.id===id);
 if(!r)return;
 const q=parseDec(val)>0?r3(parseDec(val)):1;
 r.qty=q;
 save();
 render();
}

/** Mengubah catatan sebuah baris draft. */
function updReqNote(id,val){
 const r=(S.reqs||[]).find(x=>x.id===id);
 if(!r)return;
 r.note=String(val||'').trim();
 save();
}

/** Menghapus satu baris dari draft. */
function delReq(id){
 S.reqs=(S.reqs||[]).filter(x=>x.id!==id);

 renderNav();
 render();
 toast('Item dihapus dari daftar pesanan');
}

/** Mengosongkan seluruh draft dengan konfirmasi dua klik (kunci pend "clr_req"). */
function clearReqs(){

  pend='clr_req';
  render();
  setTimeout(()=>{if(pend==='clr_req'){pend=null;if(V==='req')render()}},3000);

 pend=null;

/** Nomor dokumen PR berikutnya hari ini, format PR-MNT/YYYYMMDD/NN (urutan dihitung dari form berjalan + arsip). */
function nextPrDocNo(){
 const td=today().replace(/-/g,'');
 const prefix=`PR-MNT/${td}/`;
 let maxSeq=0;
 [...(S.reqForms||[]),...(S.reqArchive||[])].forEach(f=>{
  if(String(f.docNo||'').startsWith(prefix)){
   const n=Number(f.docNo.slice(prefix.length))||0;
   if(n>maxSeq)maxSeq=n;
  }
 });
 return prefix+String(maxSeq+1).padStart(2,'0');
}

/** Mengubah draft menjadi Form PR baru di S.reqForms, mengosongkan draft, dan membuka form itu di Proses Request. */
function createReqFormFromDraft(){
 if(!Array.isArray(S.reqForms))S.reqForms=[];
 const docNo=nextPrDocNo();
 const newForm={
  id:uid(),
  docNo,
  date:today(),
  time:wibTime(),
  items:S.reqs.map(r=>{
   const it=findById(r.itemId);
   const curStock=it?it.stock:(r.stockSnapshot??0);
   let noteText=r.note||'';
   if(curStock<=0&&(!noteText||noteText==='Restock Stok Habis (0)'))noteText='Stok Habis';
   return {
    id:uid(),
    itemId:r.itemId,
    sku:it?it.sku:(r.sku||'-'),
    name:it?it.name:(r.name||'-'),
    stockSnapshot:curStock,
    qty:Number(r.qty)||1,
    unit:it?it.unit:(r.unit||'pcs'),
    note:noteText,
    received:false
   };
  })
 };
 S.reqForms.unshift(newForm);
 S.reqs=[];
 openFormId=newForm.id;
 procTab='active';
 save();
 renderNav();
 return newForm;
}

/* ==========================================================================
   [16] FITUR: PROSES REQUEST (monitoring kedatangan + Arsip PR)
   --------------------------------------------------------------------------
   Tujuan   : Memantau Form PR yang sudah dibuat dan mencatat penerimaan barang per baris.
   Menu     : tab "proc" -> vProc(). Sub-tab: "active" (form berjalan) dan "archive" (arsip).
   Akses    : semua melihat; ceklis penerimaan & hapus form = bukan supervisor; hapus arsip = user.
   Data     : S.reqForms, S.reqArchive, S.items (stok), S.tx (transaksi masuk otomatis).
   Alur     : ceklis baris (toggleReceiveReqItem) -> stok bertambah + transaksi masuk bertaut txId.
              Semua baris diterima -> form pindah ke S.reqArchive (completedDate/Time).
              Batal ceklis -> stok dikurangi & transaksi dihapus (ditolak bila stok sudah terpakai).
   Umur form: prAgeDays/prAgeBadge menandai form yang lama belum selesai.
   Cara ubah: Tampilan kartu/tabel form -> vProc(). Logika penerimaan -> toggleReceiveReqItem().
   ========================================================================== */

/** Berpindah sub-tab Proses Request ("active" | "archive"). */
function setProcTab(t){
 procTab=t;
 render();
}

/** Umur Form PR dalam hari sejak dibuat. */
function prAgeDays(f){
 const base=String(f.date||today());
 const a=new Date(base+'T12:00:00Z'),b=new Date(today()+'T12:00:00Z');
 return Math.max(0,Math.floor((b-a)/86400000));
}

/** Lencana umur Form PR: hijau (< 3 hari), kuning (3 dan 7 hari), merah (> 7 hari). */
function prAgeBadge(f){
 const d=prAgeDays(f);
 if(d>7)return `<span class="b er">🔴 Sudah ${d} Hari</span>`;
 if(d===7)return `<span class="b wa">Sudah 7 Hari</span>`;
 if(d>=3)return `<span class="b wa">Sudah 3 Hari</span>`;
 return `<span class="b ok">${d} Hari</span>`;
}

/** Tampilan Proses Request: daftar Form PR berjalan (accordion + progres) dan arsip PR dengan pencarian. */
function vProc(){
 if(!Array.isArray(S.reqForms))S.reqForms=[];
 if(!Array.isArray(S.reqArchive))S.reqArchive=[];
 if(S.reqForms.length&&!openFormId)openFormId=S.reqForms[0].id;
 if(S.reqArchive.length&&!openArchId)openArchId=S.reqArchive[0].id;

 const subTabHtml=`<div class="sub-tabs">
  <button class="btn ${procTab==='active'?'p':''}" onclick="setProcTab('active')">⏳ Dalam Proses (${S.reqForms.length})</button>
  <button class="btn ${procTab==='archive'?'p':''}" onclick="setProcTab('archive')">🗄️ Riwayat Request Selesai / Arsip PR (${S.reqArchive.length})</button>
 </div>`;

 if(procTab==='archive'){
  const q=archQ.toLowerCase();
  const filteredArch=S.reqArchive.filter(f=>{
   if(!q)return true;
   const hay=[f.docNo,f.date,f.completedDate||'',...f.items.map(i=>i.sku+' '+i.name+' '+(i.receivedBy||''))].join(' ').toLowerCase();
   return hay.includes(q);
  });

  const archCards=filteredArch.map(f=>{

    <td><b>${esc(it.receivedBy||'Admin Gudang')}</b></td>
    <td><span class="b ok">✓ Diterima (${esc(it.receivedDate||f.completedDate||'-')}${it.receivedTime?' '+esc(it.receivedTime)+' WIB':''})</span></td>
   </tr>`).join('');

   return `<div class="card pr-card ${isOpen?'open':''}">
    <div class="pr-head" onclick="toggleOpenArch('${f.id}')">
     <div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">

     </div>

      <button class="btn s" onclick="printReqFormById('${f.id}',event)" title="Cetak Bukti PDF Arsip PR">🖨️ Cetak PDF</button>
      ${currentUser==='user'?`<button class="btn s d" onclick="delArchForm('${f.id}',event)" title="Hapus Permanen dari Arsip">${pend==='arf_'+f.id?'Yakin Hapus?':'Hapus Arsip'}</button>`:''}
      <span style="font-size:14px;color:var(--mt);padding:0 4px">${isOpen?'▲':'▼'}</span>
     </div>
    </div>
    ${isOpen?`<div class="pr-body">
     <div style="font-size:13px;margin-bottom:10px"><b>Rincian Penerimaan Barang pada Form ${esc(f.docNo)}:</b> Seluruh barang di bawah ini telah masuk ke stok gudang dan tercatat di Riwayat Barang Masuk.</div>
     <div class="tw" style="background:var(--sf);border:1px solid var(--bd)">
      <table>
       <thead>
        <tr>
         <th class="c" style="width:42px">No</th>
         <th>Kode</th>
         <th>Nama Sparepart</th>
         <th class="r">Stok Saat Request</th>

         <th>Waktu Kedatangan</th>
        </tr>
       </thead>
       <tbody>${rows}</tbody>
      </table>
     </div>
    </div>`:''}
   </div>`;
  }).join('')||`<div class="card" style="text-align:center;padding:32px">
   <h3 style="margin-bottom:6px">Belum Ada Arsip Request Selesai yang Cocok</h3>
   <p class="mt" style="margin:0">Form Request yang seluruh barangnya telah selesai dicentang pada tab <b>⏳ Dalam Proses</b> akan otomatis tersimpan di halaman arsip ini.</p>
  </div>`;

  return `<div class="page-head">
   <div>
    <h2>🗄️ Riwayat Request Selesai (Arsip PR)</h2>
    <p class="page-subtitle">Daftar seluruh Form Request (PR) yang barangnya sudah 100% diterima di gudang untuk keperluan kontrol dan audit.</p>
   </div>
   <div class="page-actions">
    <button class="btn p" onclick="go('req')">＋ Buat Form Request Baru</button>
   </div>
  </div>
  ${subTabHtml}
  <div class="tb">
   <input placeholder="Cari nomor dokumen PR, nama barang, kode SKU, atau PIC penerima…" value="${esc(archQ)}" oninput="archSearch(this.value)">
   <span id="archReset">${archQ?`<button class="btn s" onclick="archQ='';render()">Reset Pencarian</button>`:''}</span>
  </div>
  <div id="archList">${archCards}</div>`;

/**
 * Inti penerimaan barang. isChecked=true: tambah stok + buat transaksi masuk (catat PIC penerima rcvPic & jumlah diterima).
 * Bila semua baris selesai: pindahkan form ke arsip. isChecked=false: batalkan penerimaan (stok & transaksi dikembalikan).
 * @param formId id Form PR, rowId id baris, isChecked status ceklis baru.
 */
function toggleReceiveReqItem(formId,rowId,isChecked){
 if(currentUser==='supervisor'){toast('Akses ditolak! Supervisor tidak dapat mencatat penerimaan barang.');render();return}
 const f=(S.reqForms||[]).find(x=>x.id===formId);
 if(!f)return;
 const row=(f.items||[]).find(x=>x.id===rowId);
 if(!row)return;

 let master=findById(row.itemId);
 if(!master)master=S.items.find(x=>x.sku===row.sku);
 if(!master){toast('Master barang ini sudah dihapus, penerimaan tidak dapat dicatat.');render();return}

 if(isChecked && !row.received){
  const inp=document.getElementById('rq_'+rowId);
  const qty=r3(inp?parseDec(inp.value):(Number(row.qty)||0));
  if(!(qty>0)){toast('Isi jumlah yang diterima (lebih dari 0)');render();return}
  const picName=rcvPic.trim()||'Admin Gudang';
  row.received=true;
  row.receivedDate=today();
  row.receivedTime=wibTime();
  row.receivedBy=picName;
  row.recvQty=qty;
  master.stock=r3((Number(master.stock)||0)+qty);
  const txId=uid();
  row.txId=txId;
  S.tx.push({
   id:txId,
   date:today(),
   time:wibTime(),
   item:master.id,
   type:'in',
   qty:qty,
   pic:picName,
   by:currentUser,
   note:`Diterima dari Form ${f.docNo}`+(qty!==Number(row.qty)?` (dipesan ${num(row.qty)})`:'')
  });
  const diffNote=qty<Number(row.qty)?` — kurang ${num(r3(row.qty-qty))} dari pesanan`:(qty>Number(row.qty)?` — lebih ${num(r3(qty-row.qty))} dari pesanan`:'');

  const allDone=f.items.every(x=>x.received);
  if(allDone){
   if(!Array.isArray(S.reqArchive))S.reqArchive=[];
   f.completedDate=today();
   f.completedTime=wibTime();
   S.reqArchive.unshift(f);
   S.reqForms=S.reqForms.filter(x=>x.id!==formId);
   openFormId=S.reqForms[0]?.id||null;
   openArchId=f.id;
   save();
   renderNav();
   render();
   toast(`Semua item ${f.docNo} diterima! Form selesai & dipindahkan ke Arsip PR.`);
   return;
  }
  save();
  renderNav();
  render();
  toast(`"${row.name}" (+${num(qty)} ${row.unit}) masuk ke Stok & Riwayat Barang Masuk${diffNote}`);
 }else if(!isChecked && row.received){
  const qty=Number(row.recvQty??row.qty)||0;
  if(master.stock<qty){
   toast('Gagal batal ceklis: stok barang saat ini sudah terpakai');
   render();
   return;
  }
  master.stock=r3(master.stock-qty);
  if(row.txId){
   S.tx=S.tx.filter(t=>t.id!==row.txId);
   row.txId=null;
  }
  row.received=false;
  row.receivedDate='';
  row.receivedTime='';
  row.receivedBy='';
  delete row.recvQty;
  save();
  renderNav();
  render();
  toast(`Penerimaan "${row.name}" dibatalkan & stok dikembalikan`);
 }
}

/** Validasi (nama & jabatan wajib, nama tidak boleh ganda) lalu tambah/ubah PIC. Saat ubah, riwayat transaksi lama ikut disinkronkan. */
function savePic(){
 if(!['user','supervisor'].includes(currentUser))return toast('Akses ditolak.');
 const name=$('#pic_name')?.value.trim(),title=$('#pic_title')?.value.trim();
 if(!name||!title)return toast('Nama dan jabatan PIC wajib diisi.');
 if((S.pics||[]).some(p=>p.id!==editPicId&&p.name.toLowerCase()===name.toLowerCase()))return toast('Nama PIC sudah terdaftar.');
 if(editPicId){
  const p=S.pics.find(x=>x.id===editPicId);
  if(p){
   const old=p.name;
   p.name=name;
   p.title=title;
   // Sinkronkan nama & jabatan PIC pada riwayat transaksi lama
   S.tx.forEach(t=>{if(t.pic===old){t.pic=name;t.picTitle=title;}});
  }
 }else S.pics.push({id:uid(),name,title,active:true,createdBy:currentUser});
 editPicId=null;
 save();
 toast('Master PIC berhasil disimpan.');
 render();
}

 p.active=p.active===false;

 pend=null;
 save();
 toast('PIC berhasil dihapus dari Master PIC. Riwayat transaksi tetap tersimpan.');
 render();
}

/** Membuat tampilan daftar pemeriksaan Stock Opname. Menambahkan barang ke daftar belum mengubah stok. */
function opnameQueueHtml(){
 const q=OPQ||[];
 const diffCount=q.filter(x=>{const it=findById(x.itemId);const sys=it?Number(it.stock)||0:x.systemQty;return r3(x.actualQty-sys)!==0}).length;
 const rows=q.map((x,n)=>{
  const it=findById(x.itemId);
  const sys=it?r3(Number(it.stock)||0):r3(x.systemQty);
  const actual=r3(x.actualQty);
  const diff=r3(actual-sys);
  const unit=it?it.unit:(x.unit||'pcs');
  return `<tr>
   <td>${n+1}</td>
   <td><b>${esc(it?it.sku:x.sku)}</b><small>${esc(it?it.name:x.name)}</small></td>
   <td class="r">${num(sys)} ${esc(unit)}</td>
   <td class="r" style="width:140px"><input type="text" inputmode="decimal" value="${esc(actual)}" oninput="cleanDec(this)" style="text-align:right;padding:5px 8px;max-width:95px" onchange="updOpnameQueueActual(${n},this.value)"> ${esc(unit)}</td>
   <td class="r"><b style="color:${diff===0?'var(--ok)':diff>0?'var(--ok)':'var(--er)'}">${diff>0?'+':''}${num(diff)}</b> ${esc(unit)}${diff===0?'<small>Sesuai</small>':`<small>${diff>0?'Lebih':'Kurang'}</small>`}</td>
   <td>${esc(x.pic||'-')}${x.picTitle?`<small>${esc(x.picTitle)}</small>`:''}<small>${esc(x.date||today())}</small></td>
   <td><input type="text" placeholder="Keterangan (opsional)" value="${esc(x.note||'')}" style="padding:5px 8px;min-width:140px" onchange="updOpnameQueueNote(${n},this.value)"></td>
   <td><button class="btn s d" onclick="removeOpnameQueueItem(${n})">Hapus</button></td>
  </tr>`;
 }).join('');
 return `<div class="card">
  <div class="row" style="justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
   <div><h3>📋 Daftar Pemeriksaan Barang Stock Opname</h3>
    <p class="mt">Periksa seluruh hasil hitung fisik terlebih dahulu. Stok gudang dan riwayat opname belum berubah sebelum konfirmasi akhir.</p></div>
   <span class="b ${diffCount>0?'wa':'ok'}">${q.length} barang · ${diffCount} selisih</span>
  </div>
  ${q.length?`<div class="tw" style="margin-top:10px"><table><thead><tr><th>No.</th><th>Barang</th><th class="r">Stok Sistem</th><th class="r">Stok Fisik</th><th class="r">Selisih</th><th>PIC & Tanggal</th><th>Keterangan</th><th>Aksi</th></tr></thead><tbody>${rows}</tbody></table></div>
   <div class="form-actions" style="margin-top:14px;justify-content:flex-end">
    <button class="btn" onclick="clearOpnameQueue()">Kosongkan Daftar</button>
    <button class="btn p" onclick="commitOpnameQueue()">✓ Konfirmasi & Simpan Semua Hasil Opname (${q.length} barang)</button>
   </div>`:`<div class="mt" style="padding:16px;text-align:center;border:1px dashed var(--bd);border-radius:10px;margin-top:10px">Belum ada barang dalam daftar pemeriksaan opname. Tambahkan barang dari formulir di atas.</div>`}
 </div>`;
}

/** Gambar ulang panel daftar pemeriksaan opname saja tanpa mengganggu isian form. */
function drawOpnameQueue(){

}

/** Tambahkan satu baris hasil hitung fisik ke daftar pemeriksaan Stock Opname, tanpa mengubah stok. */
function addOpnameToQueue(){
 if(currentUser==='supervisor')return toast('Akses ditolak! Supervisor hanya dapat melihat data.');
 const i=findOpItem($('#op_item')?.value);
 const rawActual=String($('#op_actual')?.value??'').trim();
 const actual=r3(parseDec(rawActual));
 const pic=($('#op_pic')?.value||'').trim();
 const note=($('#op_note')?.value||'').trim();
 if(!i)return toast('Pilih barang yang valid dari daftar.');
 if(rawActual===''||!Number.isFinite(actual)||actual<0)return toast('Isi stok fisik dengan angka 0 atau lebih.');
 if(!pic)return toast('Pilih PIC Opname dari daftar.');
 if(!findPic(pic))return toast('PIC tidak valid. Pilih PIC yang terdaftar pada Master PIC.');
 const before=r3(Number(i.stock)||0);
 const exIdx=OPQ.findIndex(x=>x.itemId===i.id);
 if(exIdx>=0){
  OPQ[exIdx].systemQty=before;
  OPQ[exIdx].actualQty=actual;
  OPQ[exIdx].diff=r3(actual-before);
  OPQ[exIdx].pic=pic;
  OPQ[exIdx].picTitle=findPic(pic)?.title||'';
  if(note)OPQ[exIdx].note=note;
  OPQ[exIdx].date=today();
  toast(`Data opname "${i.name}" di daftar pemeriksaan diperbarui (Stok fisik: ${num(actual)} ${i.unit}).`);
 }else{
  OPQ.push({
   id:uid(),date:today(),itemId:i.id,sku:i.sku,name:i.name,unit:i.unit,
   systemQty:before,actualQty:actual,diff:r3(actual-before),pic,picTitle:findPic(pic)?.title||'',note,by:currentUser
  });
  qSave();toast('Barang ditambahkan ke daftar pemeriksaan opname. Stok belum berubah.');
 }
 if($('#op_item'))$('#op_item').value='';
 if($('#op_system'))$('#op_system').value='';
 if($('#op_actual'))$('#op_actual').value='';
 if($('#op_note'))$('#op_note').value='';
 if($('#op_hint'))$('#op_hint').textContent='Pilih barang untuk melihat stok sistem.';
 drawOpnameQueue();
 $('#op_item')?.focus();
}

/** Mengubah jumlah stok fisik langsung dari tabel daftar pemeriksaan opname. */
function updOpnameQueueActual(index,val){
 if(!OPQ||index<0||index>=OPQ.length)return;
 const raw=String(val??'').trim();
 const actual=r3(parseDec(raw));
 if(raw===''||!Number.isFinite(actual)||actual<0){
  toast('Stok fisik harus berupa angka 0 atau lebih.');
  drawOpnameQueue();
  return;
 }
 const row=OPQ[index];
 const it=findById(row.itemId);
 const sys=it?r3(Number(it.stock)||0):r3(row.systemQty);
 row.systemQty=sys;
 row.actualQty=actual;
 row.diff=r3(actual-sys);
 drawOpnameQueue();
}

/** Mengubah keterangan langsung dari tabel daftar pemeriksaan opname. */
function updOpnameQueueNote(index,val){
 if(!OPQ||index<0||index>=OPQ.length)return;
 OPQ[index].note=String(val||'').trim();
}

/** Hapus satu baris dari daftar pemeriksaan opname. */
function removeOpnameQueueItem(index){
 if(!OPQ||index<0||index>=OPQ.length)return;
 OPQ.splice(index,1);
 drawOpnameQueue();
}

/** Kosongkan seluruh daftar pemeriksaan opname tanpa mengubah stok. */
function clearOpnameQueue(){
 if(!OPQ||!OPQ.length)return;
 OPQ=[];
 drawOpnameQueue();
 toast('Daftar pemeriksaan opname dikosongkan. Stok tidak berubah.');
}

/** Validasi ulang seluruh daftar pemeriksaan opname lalu simpan sekaligus ke riwayat & sesuaikan stok. */
function commitOpnameQueue(){
 if(currentUser==='supervisor')return toast('Akses ditolak! Supervisor hanya dapat melihat data.');
 const q=OPQ||[];
 if(!q.length)return toast('Daftar pemeriksaan opname masih kosong.');
 for(const x of q){
  const it=findById(x.itemId);
  if(!it)return toast(`Barang "${x.name||x.sku}" tidak ditemukan di Master Barang. Hapus baris tersebut lalu periksa kembali.`);
  if(!Number.isFinite(x.actualQty)||x.actualQty<0)return toast(`Stok fisik untuk "${it.name}" tidak valid.`);
  if(!String(x.pic||'').trim())return toast(`PIC opname untuk "${it.name}" belum diisi.`);
 }
 S.opnames=S.opnames||[];
 let adjCount=0;
 q.forEach(x=>{
  const it=findById(x.itemId);
  const before=r3(Number(it.stock)||0);
  const actual=r3(Number(x.actualQty)||0);
  const diff=r3(actual-before);
  const rec={
   id:uid(),date:x.date||today(),itemId:it.id,sku:it.sku,name:it.name,
   systemQty:before,actualQty:actual,diff,pic:x.pic.trim(),picTitle:x.picTitle||'',note:x.note||'',by:x.by||currentUser
  };
  S.opnames.push(rec);
  if(diff!==0){
   it.stock=actual;
   S.tx.push({
    id:uid(),date:x.date||today(),time:wibTime(),item:it.id,type:diff>0?'in':'out',
    qty:r3(Math.abs(diff)),pic:x.pic.trim(),by:x.by||currentUser,isAdj:true,isOpname:true,
    note:'Penyesuaian Stock Opname'+(rec.note?': '+rec.note:'')
   });
   adjCount++;
  }
 });
 const totalCount=q.length;
 OPQ=[];
 save();
 toast(`${totalCount} hasil stock opname berhasil dikonfirmasi & disimpan (${adjCount} penyesuaian stok).`);
 go('opname');
}

/** Alias kompatibilitas: memanggil addOpnameToQueue(). */
function saveOpname(){
 addOpnameToQueue();
}

function delOpnameRecord(id){
 if(currentUser==='supervisor')return toast('Akses ditolak! Supervisor tidak dapat menghapus riwayat.');
 if(pend!=='opn_'+id){
  pend='opn_'+id;
  render();
  setTimeout(()=>{if(pend==='opn_'+id){pend=null;if(V==='opname')render()}},3000);
  return;
 }
 pend=null;
 S.opnames=(S.opnames||[]).filter(x=>x.id!==id);
 save();
 toast('Riwayat Stock Opname berhasil dihapus');
 render();
}

/** Membuat laporan mutasi Daftar Suku Cadang sebagai file Excel (.xls, format SpreadsheetML). */
/** Baris laporan mutasi (stok awal, masuk, keluar, sisa) per barang pada periode. Dipakai ekspor Excel dan cetak PDF. */
function mutasiRows(from,to,hideIdle){
 const inRange=x=>(!from||x.date>=from)&&(!to||x.date<=to);
 const sum=(arr,ty)=>arr.filter(x=>x.type===ty).reduce((s,x)=>s+(Number(x.qty)||0),0);
 let rows=filteredInventoryItems().map(i=>{
  const tx=S.tx.filter(x=>x.item===i.id);
  const after=to?tx.filter(x=>x.date>to):[];
  const masuk=r3(sum(tx.filter(x=>inRange(x)&&!x.isInit&&x.note!=='Stok awal'),'in'));
  const keluar=r3(sum(tx.filter(inRange),'out'));
  const ending=Math.max(0,r3((Number(i.stock)||0)-sum(after,'in')+sum(after,'out')));
  const opening=Math.max(0,r3(ending-masuk+keluar));
  return {i,opening,masuk,keluar,ending};
 });
 if(hideIdle)rows=rows.filter(r=>r.masuk>0||r.keluar>0);
 return rows;
}

 }).join('')+'</Row>').join('');
 const xml=`<?xml version="1.0" encoding="UTF-8"?>\n<?mso-application progid="Excel.Sheet"?>\n<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet" xmlns:html="http://www.w3.org/TR/REC-html40"><Styles><Style ss:ID="Default" ss:Name="Normal"><Alignment ss:Vertical="Bottom"/><Borders/><Font ss:FontName="Arial" ss:Size="10"/><Interior/><NumberFormat/><Protection/></Style><Style ss:ID="Header"><Font ss:Bold="1"/><Interior ss:Color="#D9E2F3" ss:Pattern="Solid"/></Style></Styles><Worksheet ss:Name="Laporan Mutasi"><Table ss:ExpandedColumnCount="8" ss:ExpandedRowCount="${data.length+3}" x:FullColumns="1" x:FullRows="1"><Row><Cell ss:MergeAcross="7"><Data ss:Type="String">Laporan Mutasi &amp; Daftar Suku Cadang</Data></Cell></Row><Row><Cell ss:MergeAcross="7"><Data ss:Type="String">Periode: ${escXml(periodLabel(f,t))}</Data></Cell></Row><Row><Cell ss:MergeAcross="7"><Data ss:Type="String">Dicetak: ${escXml(today()+' '+wibTime()+' WIB | Filter: '+(fl||'Tidak ada'))}</Data></Cell></Row>${xmlRows}</Table><WorksheetOptions xmlns="urn:schemas-microsoft-com:office:excel"><PageSetup><Layout x:Orientation="Landscape"/></PageSetup><Print><ValidPrinterInfo/><PaperSizeIndex>9</PaperSizeIndex><Scale>85</Scale></Print><Selected/><Panes><Pane><Number>3</Number><ActiveRow>3</ActiveRow><ActiveCol>0</ActiveCol></Pane></Panes></WorksheetOptions></Worksheet></Workbook>`;
 closeExportDialog();
 dl('laporan-mutasi-sparepart-'+today()+'.xls',xml,'application/vnd.ms-excel;charset=utf-8');
}

/** Mengunduh CSV. @param w "items" (barang) | "pics" (PIC) | selain itu = riwayat transaksi. Admin tidak mendapat kolom harga. */
function expCSV(w){
 let h,r;
 if(w==='items'){
  const showPrice=currentUser!=='admin';
  h=['sku','nama','kategori','lokasi','satuan','stok','minimum',...(showPrice?['harga']:[]),'supplier'];
  r=S.items.map(i=>[i.sku,i.name,i.cat,i.loc,i.unit,i.stock,i.min,...(showPrice?[i.price]:[]),i.sup]);
 }else if(w==='pics'){
  h=['nama','jabatan','status'];
  r=(S.pics||[]).map(p=>[p.name,p.title||'',p.active===false?'nonaktif':'aktif']);
 }else{
  h=['tanggal','waktu_wib','sku','barang','jenis','jumlah','satuan','pic','jabatan_pic','diinput_oleh','catatan'];
  r=S.tx.map(t=>{const i=findById(t.item)||{};return [t.date,t.time||'',i.sku||'',i.name||'',t.type==='in'?'masuk':'keluar',t.qty,i.unit||'',t.pic||'',t.picTitle||'',t.by||'',t.note]});
 }
 dl((w==='items'?'master-barang-':w==='pics'?'master-pic-':'riwayat-transaksi-')+today()+'.csv','\ufeff'+[h,...r].map(a=>a.map(csvc).join(';')).join('\r\n'),'text/csv');
}

/** Mem-parse teks CSV (mendukung pemisah ; atau , dan tanda kutip) menjadi array baris. */
function parseCSV(t){
 t=t.replace(/^\ufeff/,'');const l=t.split(/\r?\n/)[0],d=(l.match(/;/g)||[]).length>(l.match(/,/g)||[]).length?';':',';
 const rows=[];let r=[],c='',q=false;
 for(let k=0;k<t.length;k++){const ch=t[k];
  if(q){if(ch==='"'){if(t[k+1]==='"'){c+='"';k++}else q=false}else c+=ch}
  else if(ch==='"')q=true;else if(ch===d){r.push(c);c=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[k+1]==='\n')k++;r.push(c);c='';if(r.some(x=>x!==''))rows.push(r);r=[]}
  else c+=ch}
 r.push(c);if(r.some(x=>x!==''))rows.push(r);return rows;
}

/**
 * Import dari file terpilih (#imp). Hanya user.
 * JSON: ganti seluruh data (konfirmasi dua klik), pulihkan PIC; cadangan lama tanpa PIC -> PIC dibentuk dari riwayat.
 * CSV barang: tambah/perbarui per SKU. CSV PIC: tambah/perbarui per nama (kolom status opsional).
 */
/** Memeriksa dan membersihkan cadangan JSON sebelum dipakai: hanya objek yang valid, id hanya huruf/angka/-/_, angka dipastikan angka. */
function cleanImport(o){
 if(!o||typeof o!=='object'||!Array.isArray(o.items)||!Array.isArray(o.tx))throw new Error('Struktur cadangan tidak valid');
 const sid=v=>String(v??'').replace(/[^A-Za-z0-9_-]/g,'');
 const objs=a=>(Array.isArray(a)?a:[]).filter(x=>x&&typeof x==='object');
 const toN=v=>{const n=Number(v);return isFinite(n)?n:0};
 const lines=f=>objs(f.items).map(x=>({...x,id:sid(x.id)||uid(),itemId:sid(x.itemId),qty:toN(x.qty)}));
 const items=objs(o.items).map(i=>({...i,id:sid(i.id)||uid(),sku:String(i.sku??''),name:String(i.name??''),stock:toN(i.stock),min:toN(i.min)}));
 const tx=objs(o.tx).filter(t=>t.type==='in'||t.type==='out').map(t=>({...t,id:sid(t.id)||uid(),item:sid(t.item),qty:toN(t.qty)}));
 const reqForms=objs(o.reqForms).map(f=>({...f,id:sid(f.id)||uid(),items:lines(f)}));
 const reqArchive=objs(o.reqArchive).map(f=>({...f,id:sid(f.id)||uid(),items:lines(f)}));
 const reqs=objs(o.reqs).map(r=>({...r,id:sid(r.id)||uid(),itemId:sid(r.itemId),qty:toN(r.qty)}));
 const opnames=objs(o.opnames).map(x=>({...x,id:sid(x.id)||uid(),itemId:sid(x.itemId),systemQty:toN(x.systemQty),actualQty:toN(x.actualQty),diff:toN(x.diff)}));
 const pics=objs(o.pics).filter(p=>p.name).map(p=>({...p,id:sid(p.id)||uid()}));
 return {...o,items,tx,reqs,reqForms,reqArchive,opnames,pics,meta:o.meta&&typeof o.meta==='object'?o.meta:{}};
}

function doImport(){
 if(currentUser!=='user')return toast('Akses ditolak! Hanya User utama yang dapat melakukan import data.');
 const f=$('#imp').files[0];if(!f)return toast('Pilih file .csv atau .json terlebih dahulu');
 const isJ=/\.json$/i.test(f.name);
 if(isJ&&pend!=='imp'){pend='imp';toast('Import .json menggantikan SEMUA data. Klik Proses Import lagi untuk lanjut');setTimeout(()=>{pend=null},5000);return}
 pend=null;const rd=new FileReader();rd.onerror=()=>toast('Gagal membaca file');
 rd.onload=()=>{try{
  if(isJ){const o=cleanImport(JSON.parse(rd.result));dl('cadangan-sebelum-impor-'+today()+'.json',JSON.stringify(S,null,2),'application/json');S={items:o.items,tx:o.tx,reqs:Array.isArray(o.reqs)?o.reqs:[],reqForms:Array.isArray(o.reqForms)?o.reqForms:[],reqArchive:Array.isArray(o.reqArchive)?o.reqArchive:[],opnames:Array.isArray(o.opnames)?o.opnames:[],pics:Array.isArray(o.pics)?o.pics.filter(p=>p&&p.name).map(p=>({...p,id:p.id||uid(),name:String(p.name).trim(),title:p.title||'',active:p.active!==false})):[],meta:o.meta&&typeof o.meta==='object'?o.meta:{}};
   // Cadangan lama (sebelum ada Master PIC): bentuk daftar PIC dari riwayat barang keluar.
   if(!S.pics.length){const old=[...new Set(S.tx.filter(t=>t.type==='out'&&t.pic).map(t=>t.pic))];S.pics=old.map((name,i)=>({id:'PIC-'+(i+1),name,title:'Jabatan belum diisi',active:true,createdBy:'migrasi'}));}
   save();toast('Cadangan dipulihkan: '+S.items.length+' barang, '+S.pics.length+' PIC');go('dash')}
  else{const rows=parseCSV(rd.result),h=(rows.shift()||[]).map(x=>x.trim().toLowerCase());
   const ix=k=>h.indexOf(k);
   if(ix('sku')<0&&ix('nama')>=0&&ix('jabatan')>=0){
    if(!Array.isArray(S.pics))S.pics=[];let pa=0,pu=0;
    rows.forEach(a=>{const g=k=>ix(k)<0?'':(a[ix(k)]||'').trim();const name=g('nama'),title=g('jabatan');if(!name)return;
     const st=g('status').toLowerCase(),active=!/^(nonaktif|non-aktif|tidak aktif|inactive|false|0)$/.test(st);
     const e=S.pics.find(p=>String(p.name).toLowerCase()===name.toLowerCase());
     if(e){e.title=title||e.title||'';if(ix('status')>=0)e.active=active;pu++}
     else{S.pics.push({id:uid(),name,title:title||'Jabatan belum diisi',active,createdBy:currentUser});pa++}});
    save();toast(pa+' PIC baru ditambahkan, '+pu+' PIC diperbarui');go('pic');return}
   if(ix('sku')<0||ix('nama')<0)throw 0;let add=0,upd=0;
   rows.forEach(a=>{const g=k=>ix(k)<0?'':(a[ix(k)]||'').trim();const sku=g('sku');if(!sku||!g('nama'))return;
    const o={sku,name:g('nama'),cat:g('kategori')||'Umum',loc:g('lokasi'),unit:g('satuan')||'pcs',stock:r3(Math.max(0,idNum(g('stok')))),min:r3(Math.max(0,idNum(g('minimum')))),price:Math.max(0,idNum(g('harga'))),sup:g('supplier')};
    const e=S.items.find(i=>i.sku===sku);
    if(e){
     const diff=r3(o.stock-(Number(e.stock)||0));
     Object.assign(e,o);
     if(diff!==0)S.tx.push({id:uid(),date:today(),time:wibTime(),item:e.id,type:diff>0?'in':'out',qty:r3(Math.abs(diff)),pic:actor(),by:currentUser,isAdj:true,note:'Update stok via Import CSV'});
     upd++;
    }else{
     const n={id:uid(),...o,createdAt:new Date().toISOString()};
     S.items.push(n);
     if(n.stock>0)S.tx.push({id:uid(),date:today(),time:wibTime(),item:n.id,type:'in',qty:n.stock,pic:actor(),by:currentUser,note:'Stok awal (Import CSV)',isInit:true});
     add++;
    }});
   save();toast(add+' barang baru ditambahkan, '+upd+' barang diperbarui');go('list')}
 }catch(e){toast('Format file tidak sesuai! Gunakan Contoh File Import (.csv)')}};
 rd.readAsText(f);
}

/* ==========================================================================
   [20] FITUR: AUTO BACKUP JSON KE FOLDER PILIHAN
   --------------------------------------------------------------------------
   Tujuan   : Menyimpan cadangan JSON otomatis ke folder yang dipilih pengguna.
   Teknologi: File System Access API (showDirectoryPicker). Hanya Chrome / Edge.
   Menu     : kartu di halaman Export/Import (abCardHtml) + spanduk izin di Dashboard (abBannerHtml).
   Penyimpanan: pengaturan di localStorage (mims_autobackup_cfg); handle folder di IndexedDB
              (mims_autobackup_db). Nama file: mims-autobackup-YYYY-MM-DD.json (satu per hari,
              ditimpa bila backup lagi di hari yang sama). File lama dipangkas sesuai abCfg.keep.
   Jadwal   : abCfg.mode = "change" (1 menit setelah perubahan terakhir), "hourly", atau "daily".
              save() memanggil abSchedule(); abInit() jalan saat boot.
   Izin     : setelah browser dibuka ulang, izin folder harus diberikan lagi oleh pengguna
              (tombol "Aktifkan Auto Backup") karena aturan keamanan browser.
   Cara ubah: Format nama file -> abRun(). Pilihan jadwal/jumlah file -> abCardHtml() + abSetMode/abSetKeep.
   Catatan  : Variabel di bagian ini sengaja memakai var (aman terhadap urutan inisialisasi).
   ========================================================================== */

/** Nama kunci pengaturan, nama database IndexedDB, dan awalan nama file backup. */
var AB_KEY='mims_autobackup_cfg',AB_DB='mims_autobackup_db',AB_PREFIX='mims-autobackup-';

/** Pengaturan Auto Backup: enabled, mode (change|hourly|daily), keep (jumlah file), folderName, lastAt, lastDay, lastName, lastErr. */
var abCfg={enabled:false,mode:'change',keep:14,folderName:'',lastAt:'',lastDay:'',lastName:'',lastErr:''};

/** Status runtime: handle folder, timer jadwal, penanda sedang berjalan, penanda lewati jadwal, status izin ("granted" | "prompt" | "denied" | "unknown"). */
var abHandle=null,abTimer=null,abBusy=false,abSkip=false,abPerm='unknown';

/** Memuat pengaturan tersimpan ke abCfg. */
try{Object.assign(abCfg,JSON.parse(localStorage.getItem(AB_KEY)||'{}'))}catch(e){}

/** Apakah browser mendukung pemilihan folder. */
function abSupported(){return typeof window.showDirectoryPicker==='function'}

/** Menyimpan abCfg ke localStorage. */
function abSaveCfg(){try{localStorage.setItem(AB_KEY,JSON.stringify(abCfg))}catch(e){}}

/** Jeda minimum antar backup menurut mode (0 / 1 jam / 1 hari) dalam milidetik. */
function abIntervalMs(){return abCfg.mode==='daily'?86400000:abCfg.mode==='hourly'?3600000:0}

/** Membuka database IndexedDB tempat handle folder disimpan. */
function abDb(){return new Promise((res,rej)=>{const r=indexedDB.open(AB_DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}

/** Menyimpan handle folder ke IndexedDB. */
async function abPutHandle(h){const db=await abDb();return new Promise((res,rej)=>{const t=db.transaction('h','readwrite');t.objectStore('h').put(h,'dir');t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}

/** Membaca handle folder dari IndexedDB. */
async function abGetHandle(){const db=await abDb();return new Promise((res,rej)=>{const q=db.transaction('h','readonly').objectStore('h').get('dir');q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})}

/** Menghapus handle folder dari IndexedDB. */
async function abDelHandle(){const db=await abDb();return new Promise((res,rej)=>{const t=db.transaction('h','readwrite');t.objectStore('h').delete('dir');t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}

/** Memeriksa izin tulis ke folder; bila ask=true meminta izin (harus dari klik pengguna). */
async function abCheckPerm(ask){
 if(!abHandle)return false;
 try{let p=await abHandle.queryPermission({mode:'readwrite'});if(p!=='granted'&&ask)p=await abHandle.requestPermission({mode:'readwrite'});abPerm=p;return p==='granted'}
 catch(e){abPerm='denied';return false}
}

/** Menggambar ulang Dashboard / halaman Export bila sedang tampil agar status terbaru terlihat. */
function abRefresh(){
 // Backup berjalan di latar belakang. Jangan panggil render() di sini:
 // render() mengganti seluruh #app dan dapat menghapus isian form/fokus/klik
 // yang sedang digunakan. Status backup akan diperbarui saat halaman dibuka ulang.
 return;
}

/** Menghapus file backup otomatis paling lama melebihi abCfg.keep. */
async function abPrune(){
 try{
  const names=[];
  for await(const [n,h] of abHandle.entries()){if(h.kind==='file'&&n.startsWith(AB_PREFIX)&&n.endsWith('.json'))names.push(n)}
  names.sort().reverse();
  for(const n of names.slice(Math.max(1,Number(abCfg.keep)||14))){try{await abHandle.removeEntry(n)}catch(e){}}
 }catch(e){}
}

/** Menjalankan backup: cek izin, catat S.meta.lastBackupAt, tulis file harian, pangkas file lama. @param manual true bila dari klik pengguna. */
async function abRun(manual){
 if(abBusy||!abSupported()||!abHandle)return false;
 abBusy=true;let ok=false;
 try{
  if(!(await abCheckPerm(manual))){abCfg.lastErr='Izin akses folder belum diberikan.';abSaveCfg();return false}
  S.meta=S.meta||{};S.meta.lastBackupAt=new Date().toISOString();
  abSkip=true;save();abSkip=false;
  const name=AB_PREFIX+today()+'.json';
  const fh=await abHandle.getFileHandle(name,{create:true});
  const w=await fh.createWritable();
  await w.write(JSON.stringify(S,null,2));await w.close();
  abCfg.lastAt=new Date().toISOString();abCfg.lastDay=today();abCfg.lastName=name;abCfg.lastErr='';abSaveCfg();
  await abPrune();ok=true;return true;
 }catch(e){abCfg.lastErr='Gagal menyimpan: '+(e&&e.message?e.message:e);abSaveCfg();return false}
 finally{abSkip=false;abBusy=false;abRefresh()}
}

/** Menjadwalkan backup berikutnya sesuai mode (dipanggil oleh save()). */
function abSchedule(){
 if(abSkip||!abCfg.enabled||!abHandle||abPerm!=='granted')return;
 const last=abCfg.lastAt?new Date(abCfg.lastAt).getTime():0;
 const delay=Math.max(60000,last+abIntervalMs()-Date.now());
 clearTimeout(abTimer);abTimer=setTimeout(()=>abRun(false),delay);
}

/** Saat boot: muat handle folder, cek izin, jalankan backup bila sudah waktunya. */
async function abInit(){
 if(!abSupported()||!abCfg.enabled)return;
 try{abHandle=await abGetHandle()}catch(e){abHandle=null}
 if(!abHandle){abCfg.lastErr='Folder backup tidak ditemukan. Pilih folder kembali.';abSaveCfg();return}
 if(await abCheckPerm(false)){
  const last=abCfg.lastAt?new Date(abCfg.lastAt).getTime():0;
  if(!last||Date.now()-last>=abIntervalMs())await abRun(false);
 }
 abRefresh();
}

/** Dialog pilih folder, simpan handle, aktifkan, dan jalankan backup pertama. */
async function abChoose(){
 if(!abSupported())return toast('Browser tidak mendukung pilih folder. Gunakan Google Chrome atau Microsoft Edge.');
 try{
  const h=await window.showDirectoryPicker({id:'mims-backup',mode:'readwrite',startIn:'documents'});
  abHandle=h;abPerm='granted';
  try{await abPutHandle(h)}catch(e){}
  abCfg.enabled=true;abCfg.folderName=h.name;abSaveCfg();
  const ok=await abRun(true);
  toast(ok?'Auto Backup aktif. Backup pertama tersimpan di folder "'+h.name+'"':'Folder dipilih, tetapi backup gagal. Coba pilih folder lain.');
  abRefresh();
 }catch(e){
  if(e&&e.name==='AbortError')return;
  toast('Folder tidak bisa dipakai: '+(e&&e.message?e.message:e)+' Coba buat subfolder baru, mis. Documents\\Backup MIMS.');
 }
}

/** Tombol "Backup Sekarang". */
async function abBackupNow(){
 if(!abHandle){try{abHandle=await abGetHandle()}catch(e){}}
 if(!abHandle)return abChoose();
 const ok=await abRun(true);
 toast(ok?'Backup tersimpan di folder "'+abCfg.folderName+'"':(abCfg.lastErr||'Backup gagal'));
 abRefresh();
}

/** Meminta izin folder kembali (tombol "Aktifkan Auto Backup") lalu backup. */
async function abReauth(){
 if(!abHandle){try{abHandle=await abGetHandle()}catch(e){}}
 if(!abHandle)return abChoose();
 if(await abCheckPerm(true)){abCfg.enabled=true;abSaveCfg();const ok=await abRun(true);toast(ok?'Auto Backup aktif kembali':(abCfg.lastErr||'Backup gagal'))}
 else toast('Izin akses folder ditolak.');
 abRefresh();
}

/** Mengaktifkan / menonaktifkan Auto Backup tanpa melepas folder. */
async function abToggle(){
 if(abCfg.enabled){abCfg.enabled=false;clearTimeout(abTimer);abSaveCfg();toast('Auto Backup dinonaktifkan');abRefresh();return}
 await abReauth();
}

/** Melepas folder dan menonaktifkan Auto Backup. */
async function abForget(){
 abCfg.enabled=false;abCfg.folderName='';abCfg.lastErr='';abHandle=null;abPerm='unknown';clearTimeout(abTimer);abSaveCfg();
 try{await abDelHandle()}catch(e){}
 toast('Folder backup dilepas');abRefresh();
}

/** Mengubah jadwal Auto Backup. */
function abSetMode(v){abCfg.mode=['change','hourly','daily'].includes(v)?v:'change';abSaveCfg();abSchedule();toast('Jadwal Auto Backup diperbarui')}

/** Mengubah jumlah file backup yang disimpan. */
function abSetKeep(v){abCfg.keep=Math.max(1,Number(v)||14);abSaveCfg();toast('Jumlah file backup yang disimpan diperbarui')}

/** Spanduk di Dashboard saat izin folder perlu diberikan ulang. */
function abBannerHtml(){
 if(!abSupported()||!abCfg.enabled||abPerm==='granted')return '';
 if(abPerm==='unknown'&&!abCfg.lastErr)return '';
 return `<div class="card" style="margin:12px 0;border:1px solid var(--wa);background:color-mix(in srgb,var(--wa) 8%,var(--sf))"><b style="color:var(--wa)">🗂️ Auto Backup menunggu izin</b><p class="mt" style="margin:6px 0 10px">Browser meminta izin akses ulang ke folder backup${abCfg.folderName?' <b>'+esc(abCfg.folderName)+'</b>':''} setiap kali dibuka. Klik tombol di bawah agar backup otomatis berjalan.</p><button class="btn p s" onclick="abReauth()">✅ Aktifkan Auto Backup</button></div>`;
}

/** Kartu pengaturan Auto Backup di halaman Export / Import. */
function abCardHtml(){
 const fmt=d=>d?new Date(d).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Jakarta'})+' WIB':'Belum pernah';

 const hasFolder=!!abCfg.folderName;

 const sel=(id,fn,val,opts)=>`<select id="${id}" onchange="${fn}(this.value)" style="width:auto;min-width:170px">${opts.map(([v,l])=>`<option value="${v}"${String(val)===String(v)?' selected':''}>${l}</option>`).join('')}</select>`;
 return `<div class="card" style="margin-top:14px">
