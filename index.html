<!DOCTYPE html>
<!--
==========================================================================
 MIMS - Maintenance Inventory Management System
 Dashboard Maintenance (satu file HTML, berjalan offline)
 Versi dokumen : Update 11 - Stability & Bug Fix
==========================================================================

 DAFTAR ISI DOKUMEN INI
   1. Ringkasan aplikasi
   2. Struktur file (urutan bagian)
   3. Peta fitur -> fungsi
   4. Model data (objek S)
   5. Kunci penyimpanan browser
   6. Peran & hak akses
   7. Konvensi kode (WAJIB dibaca sebelum mengubah)
   8. Panduan update (manual & dengan AI)
   9. Checklist uji setelah update
  10. Catatan temuan / hutang teknis
  11. Riwayat perubahan

==========================================================================
 1. RINGKASAN APLIKASI
==========================================================================
 - Satu file HTML berisi CSS + markup + JavaScript murni (tanpa framework,
   tanpa library luar, tanpa server). Bisa dibuka offline di Chrome / Edge.
 - Data disimpan di IndexedDB browser (database mims_data_db, kunci wh_dash_v1). Cadangan dibuat
   lewat Export JSON atau Auto Backup ke folder pilihan.
 - Seluruh tampilan dibuat dengan menyusun string HTML di fungsi berawalan "v"
   (vDash, vList, vReq, ...) lalu dimasukkan ke elemen #app oleh render().
 - Zona waktu operasional: WIB (Asia/Jakarta). Jangan memakai jam browser mentah.

==========================================================================
 2. STRUKTUR FILE (URUTAN DARI ATAS KE BAWAH)
==========================================================================
 A. Dokumen ini (komentar HTML)
 B. <style>  : CSS, dibagi per area (lihat komentar "CSS BAGIAN ...")
 C. <body>   : markup statis (login, sidebar, area konten #app, toast)
 D. <script> : JavaScript, dibagi menjadi bagian bernomor:

     [01] Penangkap error global
     [02] Utilitas dasar (DOM, format angka, ID, toast, unduh file)
     [03] Waktu WIB & jam
     [04] Tema terang/gelap
     [05] Konfigurasi & state global (variabel, ACCOUNTS, TABS)
     [06] Penyimpanan data (seed, load, save)
     [07] Helper domain (status stok, cari barang/PIC, dsb.)
     [08] Autentikasi (login, logout, sesi)
     [09] Navigasi & router tampilan (go, render, renderNav)
     [10] FITUR Dashboard
     [11] FITUR Daftar Suku Cadang (Inventory)
     [12] FITUR Master Barang (tambah / edit)
     [13] FITUR Suku Cadang Masuk & Keluar (+ riwayatnya)
     [14] FITUR Transaksi Terakhir (log gabungan)
     [15] FITUR Request Sparepart (draft + pembuatan Form PR)
     [16] FITUR Proses Request (monitoring kedatangan + arsip PR)
     [17] FITUR Master PIC
     [18] FITUR Stock Opname
     [19] FITUR Export / Import
     [20] FITUR Auto Backup JSON ke folder
     [21] Inisialisasi aplikasi (urutan boot, selalu paling bawah)

 Urutan penting: [05] state harus sebelum [21]. Fungsi (function) di-hoist
 sehingga urutan antar fungsi bebas, tetapi const / let / var dan pernyataan
 yang langsung dieksekusi (addEventListener, setInterval, try{...}) harus tetap
 berada sebelum [21] dan sesudah deklarasi yang dipakainya.

==========================================================================
 3. PETA FITUR -> FUNGSI (titik masuk untuk mencari kode)
==========================================================================
 Menu / Tab          id tab   fungsi tampilan   bagian
 ------------------  -------  ----------------  ------
 Dashboard           dash     vDash()           [10]
 Daftar Suku Cadang  list     vList()           [11]
 Master (hub)        masters  vMastersHome()     [17]
 Master Barang       master   vForm()           [12]
 Master PIC          pic      vPicMaster()      [17]
 Request Sparepart   req      vReq()            [15]
 Proses Request      proc     vProc()           [16]
 Suku Cadang Masuk   in       vTx('in')         [13]
 Suku Cadang Keluar  out      vTx('out')        [13]
 Transaksi Terakhir  tx       vRecent()         [14]
 Stock Opname        opname   vOpname()         [18]
 Export / Import     data     vData()           [19]
 (Login & Logout)    -        doLogin/doLogout  [08]
 (Auto Backup)       -        abCardHtml()      [20]

 Peta id tab -> fungsi ada di render() (bagian [09]).
 Daftar menu sidebar ada di TABS (bagian [05]).

==========================================================================
 4. MODEL DATA (objek global S, disimpan utuh sebagai JSON)
==========================================================================
 S = {
   items:      [ barang / suku cadang ],
   tx:         [ riwayat transaksi masuk & keluar ],
   reqs:       [ draft daftar pesanan (belum jadi Form PR) ],
   reqForms:   [ Form PR yang sedang diproses ],
   reqArchive: [ Form PR yang sudah selesai diterima semua ],
   opnames:    [ riwayat stock opname ],
   pics:       [ master PIC ],
   meta:       { lastBackupAt: ISO-string waktu backup JSON terakhir }
 }

 items[]      { id, sku, name, cat, loc, unit, stock, min, price, sup, createdAt }
              - sku unik; stock & min = angka (boleh desimal, dibulatkan r3()).
              - price = sisa data lama, tidak lagi diedit di form (sejak Update 13).
 tx[]         { id, date 'YYYY-MM-DD', time 'HH:MM', item (id barang),
                type 'in'|'out', qty, pic, picTitle, by (peran penginput), note,
                isInit?, isAdj?, isOpname? }
              - isInit   = stok awal saat barang dibuat / import.
              - isAdj    = penyesuaian otomatis (edit master, opname, import CSV).
              - isOpname = penyesuaian dari Stock Opname.
              - Transaksi isInit/isAdj TIDAK dihitung di grafik & analisis pemakaian.
 reqs[]       { id, itemId, sku, name, stockSnapshot, qty, unit, note }
 reqForms[]   { id, docNo 'PR-MNT/YYYYMMDD/NN', date, time,
                items: [ { id, itemId, sku, name, stockSnapshot, qty, unit, note,
                           received, receivedDate, receivedTime, receivedBy,
                           recvQty, txId } ],
                completedDate?, completedTime? (terisi saat dipindah ke arsip) }
 opnames[]    { id, date, itemId, sku, name, systemQty, actualQty, diff, pic,
                note, by }
 pics[]       { id, name, title (jabatan), active, createdBy }

 Status stok dihitung (tidak disimpan): Habis (stock <= 0), Menipis
 (stock <= min), selain itu Aman. Lihat fungsi stat().

==========================================================================
 5. KUNCI PENYIMPANAN BROWSER
==========================================================================
 IndexedDB     mims_data_db/wh_dash_v1 : seluruh data S (JSON). JANGAN ganti nama
                                     kunci ini, data pengguna lama akan hilang.
 localStorage  wh_theme_v1         : 'light' | 'dark'
 sessionStorage wh_session_v1      : username yang sedang login (hilang saat tab ditutup)
 localStorage  mims_autobackup_cfg : pengaturan Auto Backup
 IndexedDB     mims_autobackup_db  : handle folder tujuan Auto Backup

==========================================================================
 6. PERAN & HAK AKSES
==========================================================================
 Daftar akun & menu yang boleh dibuka ada di ACCOUNTS (bagian [05]).
 Akun uji coba: user / supervisor / admin, kata sandi sama: 123
 (dicek di doLogin()).

   user        Kendali penuh: semua menu, edit/hapus barang, import, hapus arsip,
               Export/Import, Stock Opname, Master PIC, Auto Backup.
   supervisor  Pengawas: melihat data, menambah barang BARU, mengelola Master
               PIC. Tidak boleh input transaksi, opname, mencatat penerimaan,
               atau menghapus transaksi/form.
   admin       Operator gudang: input masuk/keluar, request, proses request,
               opname. Tidak punya menu Master dan Export/Import; harga
               disembunyikan pada beberapa tampilan.

 Penjagaan ada di dua lapis: (1) menu disaring lewat ACCOUNTS[role].tabs dan
 go(); (2) tiap fungsi aksi mengecek currentUser sendiri dan memanggil toast
 "Akses ditolak". Saat menambah aksi baru, wajib mengecek keduanya.

==========================================================================
 7. KONVENSI KODE
==========================================================================
 - Pola tampilan : vXxx() mengembalikan string HTML -> render() menaruhnya di
                   #app. Tombol memakai atribut onclick="namaFungsi(...)", jadi
                   fungsi pemanggil HARUS tetap global dan namanya TIDAK boleh
                   diganti tanpa mengubah string HTML yang memanggilnya.
 - Pola ubah data: validasi -> ubah S -> save() -> toast(...) -> render() atau
                   go('tab'). Setelah mengubah jumlah form/request, panggil juga
                   renderNav() agar lencana angka di sidebar ikut berubah.
 - Konfirmasi 2 klik: variabel pend menyimpan kunci aksi yang sedang menunggu
                   konfirmasi (contoh 'tx_<id>', 'prf_<id>', 'picdel_<id>').
                   Klik pertama mengisi pend, klik kedua menjalankan aksi, dan
                   pend dibersihkan otomatis setelah beberapa detik.
 - Keamanan HTML : semua teks dari pengguna/data yang masuk ke string HTML wajib
                   lewat esc(). Jangan menyisipkan data mentah ke innerHTML.
 - Angka         : pakai parseDec() untuk membaca input desimal, r3() untuk
                   membulatkan 3 desimal, num() / rp() untuk menampilkan.
 - Tanggal/waktu : pakai today(), wibTime(), dateOffset(), ago(). Hindari
                   new Date().toISOString() untuk tanggal lokal.
 - Penyimpanan   : jangan menulis localStorage langsung untuk data utama;
                   ubah S lalu panggil save().
 - Hak akses     : cek currentUser di awal setiap fungsi aksi.
 - Komentar      : tiap fitur punya blok "FITUR" di atasnya; tiap fungsi punya
                   komentar satu-dua baris. Perbarui komentar bila logika berubah.

==========================================================================
 8. PANDUAN UPDATE (MANUAL & DENGAN AI)
==========================================================================
 A. Menambah menu / halaman baru
    1) Buat fungsi tampilan vBaru() yang mengembalikan string HTML (di bagian
       fitur sendiri, diberi blok komentar seperti fitur lain).
    2) Tambahkan ['idbaru','ikon Label'] ke TABS.
    3) Tambahkan 'idbaru' ke ACCOUNTS[peran].tabs untuk peran yang boleh.
    4) Tambahkan idbaru: vBaru ke peta di render().
    5) Jika menu perlu terlihat aktif di sidebar saat berada di sub-halaman,
       sesuaikan logika "active" di renderNav().
    6) Buat fungsi aksi (cek peran -> ubah S -> save() -> render()).

 B. Menambah field pada barang (mis. "merk")
    1) vForm(): tambah input (#f_merk). 2) saveItem(): baca nilainya.
    3) drawTable(): tampilkan kolom. 4) expCSV('items'), expSampleCSV() dan
    doImport() (cabang CSV barang): tambah kolom. 5) printInventoryReport() /
    runExcelExport() bila perlu muncul di laporan. 6) Data lama tidak punya
    field itu: selalu beri nilai bawaan saat membaca (i.merk||'').

 C. Menambah koleksi data baru di S (mis. S.vendors)
    1) Tambah di nilai awal S (bagian [05]). 2) Normalisasi di load()
    (if(!Array.isArray(saved.vendors))saved.vendors=[];). 3) doImport() cabang
    JSON: pulihkan koleksi itu. 4) Export JSON & Auto Backup otomatis ikut
    karena memakai JSON.stringify(S). 5) Tambahkan ke bagian 4 dokumen ini.

 D. Mengubah peran, menu per peran, atau kata sandi
    ACCOUNTS (nama, role, tabs) dan pengecekan kata sandi di doLogin().
    Catatan: kata sandi saat ini statis di dalam kode (lihat bagian 10).

 E. Mengubah tampilan
    Warna ada di variabel CSS pada :root (terang) dan :root[data-theme="dark"]
    (gelap). Ubah di sana agar kedua tema konsisten.

 F. Menambah / mengubah laporan cetak (PDF)
    Laporan memakai window.open() lalu window.print() dengan template HTML di
    dalam fungsi (printReqFormPDF, printInventoryReport, expPDF,
    printStockOpnameSheet). CSS template cetak berada DI DALAM fungsi itu,
    terpisah dari CSS utama. Pop-up browser harus diizinkan.

 G. Petunjuk khusus bila memakai AI (ChatGPT / Claude / dsb.)
    - Berikan bagian 1-8 dokumen ini + bagian fitur yang akan diubah.
    - Minta AI mengubah SEKECIL MUNGKIN dan menyebutkan nama fungsi yang diubah.
    - Larang AI mengganti nama fungsi global, kunci localStorage, atau struktur
      S tanpa menyertakan migrasi di load().
    - Setelah AI menghasilkan kode, jalankan Checklist uji (bagian 9).
    - Catat perubahan di Riwayat perubahan (bagian 11) dan naikkan nomor versi.

==========================================================================

==========================================================================
 10. CATATAN TEKNIS / BATASAN YANG MASIH BERLAKU
==========================================================================
 1. Kata sandi tiga akun sama (123) dan tertulis di dalam kode; hanya cocok untuk
    pembatas peran di PC internal, bukan keamanan sungguhan.
 2. Data hanya ada di browser tempat file dibuka. Wajib rutin backup.
 3. inventoryInsights() masih menghitung daftar "inactive" (barang tanpa
    pergerakan 90 hari) walau kartunya sudah tidak tampil di Dashboard.
 4. Tidak ada sinkronisasi antar komputer / antar pengguna.
 5. Penyimpanan localStorage memiliki batas kapasitas browser; lakukan Export
    JSON berkala, terutama sebelum Import atau perubahan data besar.

==========================================================================
 11. RIWAYAT PERUBAHAN
==========================================================================
 Update 17 : PIC Penerima (Suku Cadang Masuk) dan PIC Opname kini dipilih dari Master PIC, sama seperti
             PIC Pengambilan (Suku Cadang Keluar). Jabatan PIC ikut tersimpan dan tampil di riwayat.
 Update 16 : Sesi login disimpan di sessionStorage (hilang saat tab ditutup) dan dicek dengan

             Logika mutasi untuk Excel dan PDF dipakai bersama (mutasiRows).
 Update 15 : Penyimpanan data utama pindah dari localStorage ke IndexedDB (kapasitas jauh lebih besar;

 Update 14 : Penambahan fitur List Daftar Pemeriksaan Barang di Stock Opname (dengan metode

 Update 10 : Penataan urutan kode menjadi bagian bernomor, dokumentasi tiap fitur
             dan fungsi, panduan update untuk IT / AI. Tidak ada perubahan

 Sebelumnya: Grafik donut Kondisi Stok & Status Request; PIC ikut Export/Import

<html lang="id" data-theme="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIMS | Maintenance Inventory Management</title>
<style>
/* ======================================================================
   CSS - DAFTAR ISI (urutan aturan MENENTUKAN hasil karena aturan yang
   di bawah menimpa yang di atas; jangan memindahkan blok tanpa menguji)
     BAGIAN 1  Variabel warna & tema terang/gelap
     BAGIAN 2  Dasar halaman & layout (sidebar header, area main)
     BAGIAN 3  Menu sidebar & tombol (.btn)
     BAGIAN 4  Halaman login
     BAGIAN 5  Animasi perpindahan tab
     BAGIAN 6  Komponen umum: judul, kartu, grid, KPI, batang, tabel, lencana, form
     BAGIAN 7  Komponen halaman: page-head, toolbar inventory, form card, grafik
     BAGIAN 8  Proses Request: sub-tab, kartu PR, progres, ceklis
     BAGIAN 9  Dialog / modal (dialog Export laporan)
     BAGIAN 10 Responsif (layar sempit)
     BAGIAN 11 Donut Kondisi Stok & Status Request (Dashboard)
     BAGIAN 12 Penyesuaian jarak baris daftar (.row)
   ====================================================================== */
/* BAGIAN 1: VARIABEL WARNA & TEMA TERANG (:root)
   Ubah warna aplikasi di sini. Nama pendek: bg=latar, sf=permukaan, tx=teks,
   mt=teks redup, bd=garis, ac=aksen, ok/wa/er=sukses/peringatan/error. */
:root{
 --bg:#f3f5f9;--sf:#ffffff;--sf2:#f7f9fb;--tx:#1b2330;--mt:#657085;--bd:#e1e6ee;
 --ac:#2563eb;--ac2:#e6eefd;--ok:#16a34a;--ok-bg:#eaf5ef;--wa:#d97706;--wa-bg:#fbf3e5;--er:#dc2626;--er-bg:#faeded;
 --shadow:0 3px 14px rgba(25,45,70,.045);
 color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
/* BAGIAN 1b: TEMA GELAP - menimpa variabel di atas saat atribut data-theme="dark" aktif (lihat bagian JS 04) */
:root[data-theme="dark"]{
 --bg:#0e131a;--sf:#171e29;--sf2:#222c3c;--tx:#e8edf5;--mt:#93a0b5;--bd:#2e3b4e;
 --ac:#5b8def;--ac2:#1d2a44;--ok:#10b981;--ok-bg:#132f26;--wa:#fbbf24;--wa-bg:#332711;--er:#ef4444;--er-bg:#361b1b;
 --shadow:0 3px 14px rgba(0,0,0,.25);
 color-scheme:dark
}
/* ======================================================================
   BAGIAN 2: DASAR HALAMAN & LAYOUT
   body, sidebar (header, .top, .logo, .theme-bar, .wib-badge) dan area konten main.
   Sidebar tetap di kiri (256px); pada layar sempit berubah di BAGIAN 10.
   ====================================================================== */
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:fixed;inset:0 auto 0 0;width:256px;background:var(--sf);color:var(--tx);border-right:1px solid var(--bd);z-index:10;overflow-y:auto}
.top{width:100%;height:100%;padding:22px 16px;display:flex;flex-direction:column;align-items:stretch;gap:18px}
.logo{font-size:17px;font-weight:700;margin:0;padding:0 8px 16px;border-bottom:1px solid var(--bd);color:var(--tx)}
.logo span{color:var(--ac)}
.theme-bar{display:flex;flex-direction:column;gap:8px;padding:0 4px}
.wib-badge{font-size:11px;color:var(--mt);background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;display:flex;align-items:center;justify-content:space-between}
/* ======================================================================
   BAGIAN 3: MENU SIDEBAR & TOMBOL
   nav (menu), .btn dan variannya: .p (utama), .d (bahaya), .ok (sukses), .s (kecil).
   Elemen ini diisi renderNav() di JavaScript bagian 09.
   ====================================================================== */
nav{display:flex;flex-direction:column;gap:6px;flex-wrap:nowrap}
nav button,.btn{border:1px solid var(--bd);background:var(--sf2);color:var(--tx);padding:8px 13px;border-radius:8px;cursor:pointer;font:inherit;font-weight:500;transition:background .15s,border-color .15s,filter .15s}
nav button{width:100%;display:flex;align-items:center;text-align:left;min-height:40px;padding:9px 12px;background:var(--sf);font-weight:400}
nav button:hover,.btn:hover{background:var(--ac2)}
nav button.on,.btn.p,.btn.p:hover{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.btn.d,.btn.d:hover{background:var(--er);border-color:var(--er);color:#fff;font-weight:600}
.btn.ok,.btn.ok:hover{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
.btn.p:hover,.btn.d:hover,.btn.ok:hover{filter:brightness(1.1)}
.btn.s{padding:4px 9px;font-size:12px;min-height:28px}
main{max-width:none;margin:0 0 0 256px;padding:30px clamp(18px,3vw,42px) 48px;min-height:100vh}

/* ======================================================================
   BAGIAN 4: HALAMAN LOGIN
   #loginOverlay, .login-card, .role-hint (markup ada di body, logika di JS bagian 08).
   ====================================================================== */
/* Halaman Login Overlay */
#loginOverlay{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:32px;width:100%;max-width:400px;box-shadow:var(--shadow)}
.login-card h2{margin-top:0;font-size:21px;text-align:center}
.login-card p{font-size:12px;color:var(--mt);text-align:center;margin-bottom:20px}
.role-hint{background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:12px;font-size:12px;margin-top:20px;color:var(--mt)}
.role-hint b{color:var(--tx)}

/* ======================================================================
   BAGIAN 5: ANIMASI
   .tab-content memakai fadeIn setiap render() mengganti isi #app.
   ====================================================================== */
/* Efek Animasi Fade In & Fade Out Tab */
@keyframes fadeIn{
 from{opacity:0;transform:translateY(5px)}
 to{opacity:1;transform:translateY(0)}
}
.tab-content{
 animation: fadeIn .25s ease-out forwards;
}

/* ======================================================================
   BAGIAN 6: KOMPONEN UMUM
   h2/h3, .card, .grid (.k = kartu KPI, .two = dua kolom), .kp (kartu ringkasan Dashboard),
   .br (batang horizontal), .tw + table (tabel), .b (lencana status: ok/wa/er),
   .tb (toolbar), input/select/label, .fm (grid form), .row (baris daftar), #toast.

<!-- ==================================================================
 MARKUP 3 dari 3: AREA KONTEN + TOAST
 #app diisi render() dengan hasil fungsi tampilan (vDash, vList, dst).
 #toast = notifikasi singkat (fungsi toast). Dialog Export (#expDlg) dibuat
 dinamis oleh openExportDialog() dan tidak ada di markup ini.
 ================================================================== -->
<main id="app"></main><div id="toast" role="status" aria-live="polite"></div>

<script>
/* ==========================================================================
   [01] PENANGKAP ERROR GLOBAL
   --------------------------------------------------------------------------
   Tujuan   : Jika script gagal berjalan dan area #app masih kosong, tampilkan pesan
              ramah (bukan layar putih) yang menyarankan memuat ulang / memakai Chrome atau Edge.
   Catatan  : Tidak menangani error di dalam fungsi; hanya jaring pengaman tampilan awal.
   ========================================================================== */

window.addEventListener('error',function(e){
 const msg=String(e&&e.message||'Kesalahan JavaScript');
 const app=document.getElementById('app');
 if(app&&!app.innerHTML.trim()){
  app.innerHTML='<section style="margin:24px;padding:20px;border:1px solid #e5a3a3;border-radius:12px;background:#fff7f7;color:#7f1d1d"><h2>Dashboard gagal dimuat</h2><p>Segarkan halaman. Jika masih gagal, buka file ini menggunakan Google Chrome atau Microsoft Edge versi terbaru.</p><small>Detail: '+msg.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))+'</small></section>';
 }else{
  console.error('[MIMS] JavaScript error:',e&&e.error||msg);
  const t=document.getElementById('toast');
  if(t){t.textContent='Terjadi kesalahan pada aplikasi. Periksa Console atau muat ulang jika fungsi terhenti.';t.classList.add('on');}
 }
});
window.addEventListener('unhandledrejection',function(e){
 const reason=e&&e.reason;
 console.error('[MIMS] Unhandled promise rejection:',reason);
 const t=document.getElementById('toast');
 if(t){t.textContent='Proses latar belakang gagal. Data yang sudah tersimpan tetap dipertahankan.';t.classList.add('on');}
});

/* ==========================================================================
   [02] UTILITAS DASAR
   --------------------------------------------------------------------------
   Tujuan   : Fungsi kecil yang dipakai di seluruh aplikasi. Tidak tahu apa-apa soal fitur.
   Isi      : $ (pemilih DOM), esc (anti-XSS), rp/num (format angka), uid, r3/parseDec/
              cleanDec/idNum (angka desimal), toast (notifikasi), dl (unduh file).
   Aturan   : Teks pengguna yang masuk ke string HTML WAJIB lewat esc().
   Cara ubah: Hati-hati, perubahan di sini berdampak ke semua fitur.
   ========================================================================== */

/** Pintasan document.querySelector. Contoh: $('#app'). */
const $=s=>document.querySelector(s);

/** Escape karakter HTML (& < > ") agar aman disisipkan ke string HTML. WAJIB untuk semua teks dari pengguna/data. */
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/** Format rupiah, contoh 15000 -> "Rp 15.000". */
const rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');

/** Format angka gaya Indonesia (pemisah ribuan titik), contoh 1500.5 -> "1.500,5". */
const num=n=>Number(n||0).toLocaleString('id-ID');

/** Membuat ID acak pendek (7 karakter) untuk record baru. */
const uid=()=>Math.random().toString(36).slice(2,9);

/** Membulatkan ke 3 angka desimal (hindari galat floating point pada stok). */
const r3=n=>Math.round((Number(n)||0)*1000)/1000;

/** Membaca input angka desimal pengguna (menerima koma/titik), hasil 0 bila tidak valid. */
/** Membaca angka input format Indonesia. "1.000" & "1.000.000" = ribuan; "1.250,5" & "1,5" = desimal; separator di akhir diabaikan. */
function parseDec(v){
 let s=String(v==null?'':v).replace(/rp/ig,'').replace(/\s/g,'').replace(/[.,]+$/,'');
 const seps=(s.match(/[.,]/g)||[]);
 if(seps.length&&/^-?\d{1,3}([.,]\d{3})+$/.test(s)&&seps.every(c=>c===seps[0])){s=s.replace(/[.,]/g,'')}
 else{const li=Math.max(s.lastIndexOf(','),s.lastIndexOf('.'));if(li>=0)s=s.slice(0,li).replace(/[.,]/g,'')+'.'+s.slice(li+1).replace(/[.,]/g,'')}
 const n=Number(s.replace(/[^\d.-]/g,''));
 return isFinite(n)?n:0;
}

/** Dipanggil dari oninput: membersihkan field angka agar hanya berisi digit dan satu pemisah desimal. */
function cleanDec(el){const v=String(el.value).replace(/[^\d.,]/g,'');if(el.value!==v)el.value=v}

/** Membaca angka format Indonesia/Excel ("1.250,50", "Rp 1.000") menjadi Number. Dipakai saat Import CSV. */
function idNum(s){
 s=String(s==null?'':s).replace(/rp/ig,'').replace(/\s/g,'').trim();
 if(!s)return 0;
 const hasDot=s.includes('.'),hasCom=s.includes(',');
 if(hasDot&&hasCom)s=s.replace(/\./g,'').replace(',','.');
 else if(hasCom)s=s.replace(',','.');
 else if(hasDot&&/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
 const n=Number(s);return isFinite(n)?n:0;
}

/** Menampilkan notifikasi singkat di bawah layar (2,5 detik). Elemen: #toast. */
function toast(m){
 const t=$('#toast');if(!t)return;
 t.textContent=String(m??'');t.classList.add('on');
 clearTimeout(toast.t);
 toast.t=setTimeout(()=>{if(t.isConnected)t.classList.remove('on')},3000);
}

/**
 * Mengunduh teks sebagai file (Blob + tautan sementara).
 * @param n nama file, t isi file, m tipe MIME. Dipakai semua fitur export.
 */
function dl(n,t,m){
 try{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([t],{type:m}));
  a.download=n;
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast('File '+n+' berhasil diunduh');
 }catch(e){toast('Unduhan tidak didukung di lingkungan ini')}
}

/* ==========================================================================
   [03] WAKTU OPERASIONAL WIB (Asia/Jakarta, UTC+7)
   --------------------------------------------------------------------------
   Tujuan   : Semua tanggal/jam aplikasi mengacu ke WIB, bukan zona waktu komputer.
   Format   : tanggal "YYYY-MM-DD", jam "HH:MM". Tanggal disimpan sebagai string sehingga
              bisa dibandingkan langsung dengan operator < > dan localeCompare.
   Fungsi   : wibParts -> wibDate/wibTime -> today/ago; dateOffset untuk geser tanggal.
   Jam sidebar: updateClock() dijalankan tiap 15 detik (dan setiap render()).
   Cara ubah: Untuk zona waktu lain, ganti timeZone di wibParts() dan label "WIB" di UI.
   ========================================================================== */

/** Memecah waktu menjadi bagian (year, month, day, hour, minute, second) pada zona Asia/Jakarta. */
function wibParts(d=new Date()){
 const f=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
 const p={};f.formatToParts(d).forEach(x=>{p[x.type]=x.value});
 return p;
}

/** Tanggal WIB format "YYYY-MM-DD". */
function wibDate(d=new Date()){
 const p=wibParts(d);
 return `${p.year}-${p.month}-${p.day}`;
}

/** Jam WIB format "HH:MM" (jam 24 ditulis 00). */
function wibTime(d=new Date()){
 const p=wibParts(d);
 const hh=p.hour==='24'?'00':p.hour;
 return `${hh}:${p.minute}`;
}

/** Menggeser tanggal "YYYY-MM-DD" sebanyak N hari (negatif = mundur), tanpa terpengaruh zona waktu. */
function dateOffset(baseDateStr,days){
 const [y,m,d]=baseDateStr.split('-').map(Number);
 const dt=new Date(Date.UTC(y,m-1,d,12,0,0));
 dt.setUTCDate(dt.getUTCDate()+days);
 return dt.toISOString().slice(0,10);
}

              bila belum ada, mengikuti pengaturan sistem komputer.
   Cara kerja: atribut data-theme pada elemen <html>; warna diatur variabel CSS pada :root.

   ========================================================================== */

/** Menentukan tema awal: pilihan tersimpan -> pengaturan sistem -> terang. Dipanggil saat boot. */
function initTheme(){
 let th='light';
 try{
  const saved=localStorage.getItem('wh_theme_v1');
  if(saved==='dark'||saved==='light')th=saved;
  else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches)th='dark';
 }catch(e){}
 applyTheme(th);
}

/** Menerapkan tema ("light" | "dark"), memperbarui teks tombol, dan menyimpannya. */
function applyTheme(th){
 document.documentElement.setAttribute('data-theme',th);
 const btn=$('#themeBtn');
 if(btn)btn.innerHTML=th==='dark'?'☀️ Mode Terang':'🌙 Mode Gelap';
 try{localStorage.setItem('wh_theme_v1',th)}catch(e){}
}

/** Beralih terang <-> gelap. Dipanggil tombol #themeBtn di sidebar. */
function toggleTheme(){
 const cur=document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';
 applyTheme(cur==='dark'?'light':'dark');
}

/* ---- Penyimpanan IndexedDB ----
   Data S disimpan di IndexedDB (database mims_data_db, store kv, kunci wh_dash_v1).
   Kapasitasnya jauh lebih besar daripada localStorage. Data lama dari localStorage dipindahkan
   otomatis satu kali saat file pertama kali dibuka, lalu entri lama dihapus. */
const DATA_DB='mims_data_db', DATA_STORE='kv', DATA_KEY='wh_dash_v1', LEGACY_KEY='wh_dash_v1';
let dataDbP=null;                 // koneksi IndexedDB, dibuka sekali
let saveChain=Promise.resolve();  // antrean penulisan agar urutannya tetap
let dataVer=0;                    // naik setiap kali S berubah; dipakai untuk cache hitungan turunan

/** Membuka (sekali) koneksi ke IndexedDB. */
function dataDb(){
 if(!dataDbP)dataDbP=new Promise((res,rej)=>{
  if(!('indexedDB' in window))return rej(new Error('IndexedDB tidak didukung browser ini'));
  const req=indexedDB.open(DATA_DB,1);
  req.onupgradeneeded=()=>req.result.createObjectStore(DATA_STORE);
  req.onsuccess=()=>res(req.result);
  req.onerror=()=>rej(req.error);
 });
 return dataDbP;
}

/** Membaca teks JSON data utama dari IndexedDB. */
function dataGet(){
 return dataDb().then(db=>new Promise((res,rej)=>{
  const q=db.transaction(DATA_STORE,'readonly').objectStore(DATA_STORE).get(DATA_KEY);
  q.onsuccess=()=>res(q.result);
  q.onerror=()=>rej(q.error);
 }));
}

/** Menulis teks JSON data utama ke IndexedDB. */
function dataPut(json,key=DATA_KEY){
 return dataDb().then(db=>new Promise((res,rej)=>{
  const tx=db.transaction(DATA_STORE,'readwrite');
  tx.objectStore(DATA_STORE).put(json,key);
  tx.oncomplete=()=>res(true);
  tx.onerror=()=>rej(tx.error);
  tx.onabort=()=>rej(tx.error||new Error('Penulisan dibatalkan'));
 }));
}

/**
 * Membaca S dari IndexedDB (atau dari localStorage bila ini pertama kali pindah), menormalisasi koleksi yang belum ada
 * (reqs, reqForms, reqArchive, opnames, pics, meta), dan membuat daftar PIC awal dari riwayat bila kosong.
 * Data rusak atau belum ada -> seed().
 */
async function load(){
 let raw=null, fromLegacy=false;
 try{raw=await dataGet()}catch(e){console.error('[MIMS] Gagal membaca IndexedDB:',e)}
 if(!raw){
  try{raw=localStorage.getItem(LEGACY_KEY);fromLegacy=!!raw}catch(e){}
 }
 try{
  if(raw){
   const saved=typeof raw==='string'?JSON.parse(raw):raw;
   if(saved&&Array.isArray(saved.items)&&Array.isArray(saved.tx)){
    if(!Array.isArray(saved.reqs))saved.reqs=[];
    if(!Array.isArray(saved.reqForms))saved.reqForms=[];
    if(!Array.isArray(saved.reqArchive))saved.reqArchive=[];
    if(!Array.isArray(saved.opnames))saved.opnames=[];
    if(!Array.isArray(saved.pics))saved.pics=[];
    if(!saved.meta||typeof saved.meta!=='object')saved.meta={};
    S=saved;
    if(!S.pics.length){const old=[...new Set((S.tx||[]).filter(t=>t.type==='out'&&t.pic).map(t=>t.pic))];S.pics=old.map((name,i)=>({id:'PIC-'+(i+1),name,title:'Jabatan belum diisi',active:true,createdBy:'migrasi'}));}
    dataVer++;
    if(fromLegacy){
     await dataPut(JSON.stringify(S))
      .then(()=>{try{localStorage.removeItem(LEGACY_KEY)}catch(e){}})
      .catch(e=>console.error('[MIMS] Pemindahan data lama gagal:',e));
    }
    return;
   }
  }
 }catch(e){console.error('[MIMS] Data tersimpan tidak bisa dibaca:',e)}
 if(raw){
  try{
   await dataPut(typeof raw==='string'?raw:JSON.stringify(raw),'cadangan_rusak_'+Date.now());
   toast('Data lama tidak terbaca dan disimpan sebagai cadangan di browser.');
  }catch(e){console.error('[MIMS] Cadangan data rusak gagal:',e)}
 }
 seed();
 dataVer++;
 save();
}

/** Menyimpan seluruh S ke IndexedDB lalu menjadwalkan Auto Backup. Panggil setiap selesai mengubah data. */
/** Banner merah tetap di atas layar bila data terakhir gagal tersimpan; hilang setelah penyimpanan berikutnya berhasil. */
function setSaveState(ok){
 let el=document.getElementById('saveErr');
 if(ok){if(el)el.remove();return}
 if(!el){
  el=document.createElement('div');el.id='saveErr';el.setAttribute('role','alert');
  el.style.cssText='position:fixed;top:0;left:0;right:0;z-index:2000;background:var(--er);color:#fff;padding:10px 16px;font-weight:600;text-align:center;font-size:13px';
  el.textContent='⚠️ Data terakhir TIDAK tersimpan. Ekspor backup JSON sekarang dan periksa ruang penyimpanan browser.';
  document.body.appendChild(el);
 }
}

/** Menyimpan seluruh S ke IndexedDB lalu menjadwalkan Auto Backup. Panggil setiap selesai mengubah data. */
function save(){
 dataVer++;
 const json=JSON.stringify(S);
 saveChain=saveChain.then(()=>dataPut(json)).then(()=>{
  setSaveState(true);
  // Sinkronkan seluruh state MIMS (S) ke Firebase setelah tersimpan lokal.
  if(typeof window.__mimsFirebaseWrite==='function'){
   window.__mimsFirebaseWrite(json).catch(e=>{
    console.error('[MIMS Firebase] Gagal mengirim data MIMS:',e);
    window.__mimsFirebaseSetStatus?.('Offline / gagal sinkron', 'error');
   });
  }
 }).catch(e=>{
  console.error('[MIMS] Gagal menyimpan data:',e);
  setSaveState(false);
 });
 qSave();
 try{abSchedule()}catch(e){console.error('[MIMS] Gagal menjadwalkan backup:',e)}
 return true;
}

/* ==========================================================================
   [07] HELPER DOMAIN (status stok, pencarian, hitungan bersama)
   --------------------------------------------------------------------------
   Tujuan   : Fungsi kecil yang memahami data (barang, PIC, request) dan dipakai banyak fitur.
   Status stok: Habis (stock <= 0), Menipis (stock <= min), Aman (lainnya) -> stat()/badge().
   PR berjalan : pendQty(id) = jumlah barang yang sudah dipesan tetapi belum diterima; dipakai
              agar tidak memesan ganda dan untuk lencana "dalam PR".
   ========================================================================== */

/** Status stok sebuah barang: ["Habis","er"] | ["Menipis","wa"] | ["Aman","ok"] (teks, kelas warna). */
const stat=i=>i.stock<=0?['Habis','er']:i.stock<=i.min?['Menipis','wa']:['Aman','ok'];

/** HTML lencana status stok berwarna untuk sebuah barang. */
const badge=i=>{const s=stat(i);return `<span class="b ${s[1]}">${s[0]}</span>`};

/** Daftar kategori unik (terurut) dari seluruh barang. */
const cats=()=>[...new Set(S.items.map(i=>i.cat))].sort();

/** Daftar nama PIC yang aktif; dipakai sebagai pilihan (datalist) PIC penerima di Proses Request. */
const picsList=()=>((S.pics||[]).filter(p=>p.active!==false).map(p=>p.name));

/** Mencari PIC aktif berdasarkan nama persis. Dipakai validasi barang keluar. */
const findPic=name=>(S.pics||[]).find(p=>p.name===name&&p.active!==false);

/** Mencari barang berdasarkan id. */
const findById=id=>S.items.find(x=>x.id===id);

/** Nama barang dari id ("(dihapus)" bila barang sudah tidak ada). */
const nm=id=>{const i=findById(id);return i?i.name:'(dihapus)'};

/** Satuan barang dari id. */
const unitOf=id=>{const i=findById(id);return i?i.unit:''};

/** Nama peran penginput saat ini ("User" | "Supervisor" | "Admin") untuk kolom pic/catatan otomatis. */
const actor=()=>({user:'User',supervisor:'Supervisor',admin:'Admin'})[currentUser]||'-';

/** Total jumlah barang yang sudah ada di Form PR berjalan namun belum diterima. */
/** Cache hitungan turunan: dihitung ulang hanya bila data (dataVer) atau kuncinya berubah. */
const memoStore={};
function memoBy(name,key,fn){
 const k=dataVer+'|'+key, c=memoStore[name];
 if(c&&c.k===k)return c.r;
 const r=fn();
 memoStore[name]={k,r};
 return r;
}

/** Peta kode barang -> jumlah dalam Form PR berjalan yang belum diterima. Dihitung sekali per perubahan data. */
const pendMap=()=>memoBy('pend','',()=>{
 const m=new Map();
 (S.reqForms||[]).forEach(f=>(f.items||[]).forEach(x=>{if(!x.received)m.set(x.itemId,(m.get(x.itemId)||0)+(Number(x.qty)||0))}));
 return m;
});
const pendQty=id=>pendMap().get(id)||0;

/** HTML lencana "+N dalam PR" bila barang sedang dipesan. */
const pendBadge=i=>{const q=pendQty(i.id);return q>0?` <span class="b" title="Sudah ada dalam PR yang sedang diproses">📦 +${num(q)} dalam PR</span>`:''};

/** Nomor dokumen PR yang menjadi asal sebuah transaksi masuk ("" bila bukan dari PR). Dipakai agar transaksi dari PR tidak dihapus lewat riwayat. */
const prLinkOfTx=txId=>{for(const f of [...(S.reqForms||[]),...(S.reqArchive||[])]){if((f.items||[]).some(x=>x.txId===txId))return f.docNo}return''};

/** Menjelaskan di mana barang masih dipakai (draft request / Form PR). Dipakai untuk mencegah penghapusan barang. */
function itemUsageRef(id){
 if((S.reqs||[]).some(r=>r.itemId===id))return 'daftar draft Request Sparepart';
 const f=(S.reqForms||[]).find(f=>(f.items||[]).some(x=>x.itemId===id&&!x.received));
 return f?'Form '+f.docNo+' (Proses Request)':'';
}

/* ==========================================================================
   [08] AUTENTIKASI (login, logout, sesi)
   --------------------------------------------------------------------------
   Tujuan   : Pembatas akses per peran di sisi tampilan. Bukan keamanan sungguhan (lihat
              catatan dokumentasi bagian 10).
   Tampilan : Overlay #loginOverlay (markup di <body>). Form #loginForm dikirim lewat submit
              agar klik tombol dan tombol Enter sama-sama bekerja.
   Sesi     : username disimpan di sessionStorage wh_session_v1; checkSession() memulihkannya saat boot.
   Cara ubah: Kata sandi -> pengecekan p!=='123' di doLogin(). Akun/peran -> ACCOUNTS (bagian 05).
   ========================================================================== */

/**
 * Memvalidasi username/kata sandi, mengatur currentUser, menyimpan sesi, merender menu & halaman, menyembunyikan overlay.
 * Bila render gagal: sesi dibatalkan dan pesan error ditampilkan di form login.
 */
function doLogin(){
 const userEl=$('#loginUser'),passEl=$('#loginPass'),err=$('#loginErr');
 const u=(userEl?.value||'').trim().toLowerCase();
 const p=(passEl?.value||'').trim();
 if(!Object.hasOwn(ACCOUNTS,u)||p!=='123'){
  if(err){err.textContent='Username atau password salah. Untuk akun uji coba, gunakan user / 123.';err.style.display='block'}
  passEl?.focus();return false;
 }
 if(err)err.style.display='none';
 currentUser=u;
 try{sessionStorage.setItem('wh_session_v1',u)}catch(e){/* Login tetap dapat berjalan tanpa penyimpanan sesi */}
 const acc=ACCOUNTS[u];
 if(!acc.tabs.includes(V))V='dash';
 try{
  $('#currentUserBadge').innerHTML=`<span>👤 ${acc.name}</span>`;
  renderNav();
  render();
  $('#loginOverlay').style.display='none';
  toast('Berhasil masuk sebagai '+acc.name);
  return true;
 }catch(e){
  currentUser=null;
  try{sessionStorage.removeItem('wh_session_v1')}catch(ignore){}
  $('#loginOverlay').style.display='flex';
  if(err){err.textContent='Login diterima, tetapi dashboard gagal dibuka: '+String(e?.message||e);err.style.display='block'}
  console.error('MIMS login/render error:',e);
  return false;
 }
}

/** Menghapus sesi, mengosongkan form, menampilkan kembali overlay login. */
function doLogout(){
 currentUser=null;
 try{sessionStorage.removeItem('wh_session_v1')}catch(e){}
 $('#loginOverlay').style.display='flex';
 $('#loginUser').value='';
 $('#loginPass').value='';
}

/** Saat boot: bila ada sesi tersimpan yang valid, lewati login; jika tidak tampilkan overlay. */
function checkSession(){
 try{
  const saved=sessionStorage.getItem('wh_session_v1');
  if(saved&&Object.hasOwn(ACCOUNTS,saved)){
   currentUser=saved;
   $('#loginOverlay').style.display='none';
   const acc=ACCOUNTS[saved];
   $('#currentUserBadge').innerHTML=`<span>👤 ${acc.name}</span>`;
   return;
  }
 }catch(e){}
 $('#loginOverlay').style.display='flex';
}

/** Referensi elemen form login. */
const loginForm=document.getElementById('loginForm');

/** Menghubungkan submit form login ke doLogin() (mencegah reload halaman). */
if(loginForm){
 loginForm.addEventListener('submit',function(event){
  event.preventDefault();
  doLogin();
 });
}

/** Menggambar menu sidebar sesuai peran, lencana jumlah draft request (merah) & form berjalan (kuning), dan menandai menu aktif. */

 const allowedTabs=ACCOUNTS[currentUser].tabs;
 const reqCount=(S.reqs||[]).length;
 const procCount=(S.reqForms||[]).length;
 $('#nav').innerHTML=TABS.filter(t=>allowedTabs.includes(t[0])).map(t=>{

 }).join('');

/**

 * lalu menerapkan isian awal dari tombol cepat (preItem / preReqItem / preReqQty).
 */
function go(v){
 if(v==='form')v='master';
 if(currentUser&&!ACCOUNTS[currentUser].tabs.includes(v))return toast('Akses ditolak! Akun Anda tidak memiliki izin untuk menu ini.');
 V=v;
 if(v!=='master')editId=null;
 renderNav();
 render();
 scrollTo(0,0);
 if((v==='in'||v==='out')&&preItem){
  const inp=$('#t_item');
  if(inp){inp.value=preItem;txInfo();$('#t_qty')?.focus()}
  preItem='';
 }
 if(v==='req'&&preReqItem){
  const inp=$('#r_item');
  if(inp){
   inp.value=preReqItem;
   reqInfo();
   if(preReqQty)$('#r_qty').value=preReqQty;
   $('#r_qty')?.focus();
   $('#r_qty')?.select();
  }
  preReqItem='';
  preReqQty='';
 }
}

/** Tombol cepat "Masuk/Keluar" di tabel: buka form transaksi dengan barang terisi. @param ty "in" | "out". */

/** Tombol cepat "Pesan": buka form Request dengan barang & jumlah saran (kekurangan dari minimum + 5, memperhitungkan PR berjalan). */

/** Menggambar daftar batang horizontal. @param rows [[label,nilai],...] @param f fungsi format nilai. */
function bars(rows,f){
 const m=Math.max(1,...rows.map(r=>r[1]));
 return rows.map(r=>`<div class="br"><span>${esc(r[0])}</span><i><b style="width:${r[1]/m*100}%"></b></i><em>${f(r[1])}</em></div>`).join('')||'<div class="mt">Belum ada data</div>';
}

/** Mengganti periode grafik ("1" | "7" | "30") lalu render ulang. */
function setChartPeriod(p){chartPeriod=p;render()}

/**
 * Menyusun data & HTML grafik batang penerimaan vs pemakaian sesuai chartPeriod.
 * 1 hari = per jam 07.00-17.00; 7 hari = per hari; 30 hari = per minggu. Transaksi isInit/isAdj tidak dihitung.
 * @returns {title, html}
 */
function dashboardChart(){return memoBy('chart',chartPeriod+'|'+today(),dashboardChartRaw)}
function dashboardChartRaw(){
 const todayKey=today(),rows=[];let title='',legacy=0;
 if(chartPeriod==='1'){
  title='Penerimaan & Pemakaian Hari Ini (Jam Kerja 07:00 – 17:00 WIB)';
  for(let h=7;h<=17;h++)rows.push({label:String(h).padStart(2,'0')+'.00',in:0,out:0,hour:h});
  S.tx.filter(t=>t.date===todayKey&&!t.isInit&&!t.isAdj).forEach(t=>{
   if(!t.time){legacy++;return}
   const h=Number(String(t.time).slice(0,2));
   if(h>=7&&h<=17){
    const r=rows.find(x=>x.hour===h);
    if(r)r[t.type==='in'?'in':'out']+=Number(t.qty)||0;
   }else{
    legacy++;
   }
  });
 }else if(chartPeriod==='7'){
  title='Penerimaan & Pemakaian 7 Hari per Hari (WIB)';
  for(let d=6;d>=0;d--){const key=dateOffset(todayKey,-d),dt=new Date(key+'T12:00:00Z');rows.push({key,label:dt.toLocaleDateString('id-ID',{weekday:'short',timeZone:'Asia/Jakarta'}),sub:key.slice(8,10)+'/'+key.slice(5,7),in:0,out:0})}
  S.tx.filter(t=>t.date>=rows[0].key&&t.date<=todayKey&&!t.isInit&&!t.isAdj).forEach(t=>{const r=rows.find(x=>x.key===t.date);if(r)r[t.type==='in'?'in':'out']+=Number(t.qty)||0});
 }else{
  title='Penerimaan & Pemakaian 30 Hari per Minggu (WIB)';
  const first=dateOffset(todayKey,-29);
  for(let w=0;w<5;w++){const a=dateOffset(first,w*7),b=dateOffset(first,Math.min(w*7+6,29));rows.push({key:a,end:b,label:'Minggu '+(w+1),sub:a.slice(8,10)+'/'+a.slice(5,7)+'–'+b.slice(8,10)+'/'+b.slice(5,7),in:0,out:0})}
  S.tx.filter(t=>t.date>=first&&t.date<=todayKey&&!t.isInit&&!t.isAdj).forEach(t=>{const r=rows.find(x=>t.date>=x.key&&t.date<=x.end);if(r)r[t.type==='in'?'in':'out']+=Number(t.qty)||0});
 }
 const max=Math.max(1,...rows.flatMap(r=>[r.in,r.out]));
 const barsHtml=rows.map(r=>`<div class="chart-col" title="${r.label}: diterima ${r.in}, dipakai ${r.out}"><div class="chart-bars"><span style="height:${r.in/max*100}%;background:var(--ok)"></span><span style="height:${r.out/max*100}%;background:var(--er)"></span></div><small>${r.label}</small>${chartPeriod==='1'?'':`<small class="chart-sub">${r.sub||''}</small>`}</div>`).join('');
 const sumIn=rows.reduce((a,r)=>a+r.in,0),sumOut=rows.reduce((a,r)=>a+r.out,0);
 return {title,html:`<div class="chart-toolbar"><div class="chart-period">${[['1','1 Hari'],['7','7 Hari'],['30','30 Hari']].map(([v,l])=>`<button class="btn s ${chartPeriod===v?'p':''}" onclick="setChartPeriod('${v}')">${l}</button>`).join('')}</div><div class="lg"><i style="background:var(--ok)"></i>Diterima<i style="background:var(--er)"></i>Dipakai</div></div><div class="chart-summary"><span>Diterima <b>${num(sumIn)}</b></span><span>Dipakai <b>${num(sumOut)}</b></span><span>Selisih <b>${sumIn-sumOut>=0?'+':''}${num(sumIn-sumOut)}</b></span></div><div class="chart-area ${chartPeriod==='1'?'hourly':''}">${barsHtml}</div>${chartPeriod==='1'&&legacy?`<p class="chart-note">${legacy} transaksi di luar jam kerja (07:00–17:00) atau tanpa catatan jam tidak ditampilkan pada grafik jam kerja.</p>`:''}`};
}

/** Kartu peringatan bila backup JSON terakhir > 7 hari atau belum pernah (membaca S.meta.lastBackupAt). */
function backupReminderHtml(){
 const last=S.meta?.lastBackupAt?new Date(S.meta.lastBackupAt):null;
 const age=last?Math.floor((Date.now()-last.getTime())/86400000):null;
 if(age!==null&&age<=7)return '';
 return `<div class="card" style="margin:12px 0;border:1px solid var(--er);background:color-mix(in srgb,var(--er) 7%,var(--sf))"><b style="color:var(--er)">⚠️ Pengingat Backup JSON</b><p class="mt" style="margin:6px 0 10px">${last?`Backup terakhir ${age} hari lalu. Sudah lebih dari 7 hari, segera buat cadangan.`:'Belum ada riwayat backup JSON. Buat backup pertama untuk melindungi data.'}</p>${currentUser==='user'?'<button class="btn p s" onclick="expJSON()">💾 Backup Sekarang</button>':'<span class="mt">Hubungi User utama untuk melakukan backup.</span>'}</div>`;

/**
 * Analisis pemakaian dari S.tx: "usage" = 8 barang paling sering keluar. Dihitung dalam satu kali pemindaian S.tx dan di-cache.
 */
function inventoryInsights(){
 return memoBy('insights','',()=>{
  const outCnt=new Map(), outQty=new Map();
  S.tx.forEach(t=>{
   if(t.isInit||t.isAdj||t.type!=='out')return;
   outCnt.set(t.item,(outCnt.get(t.item)||0)+1);
   outQty.set(t.item,(outQty.get(t.item)||0)+(Number(t.qty)||0));
  });
  const usage=S.items.map(i=>({i,count:outCnt.get(i.id)||0,qty:outQty.get(i.id)||0})).filter(x=>x.count>0).sort((a,b)=>b.count-a.count||b.qty-a.qty).slice(0,8);
  return {usage};
 });
}

/** Kartu "Barang Paling Sering Dipakai" (peringkat berdasarkan jumlah kali keluar). */
function inventoryInsightsHtml(){
 const x=inventoryInsights();
 const used=x.usage.map((a,n)=>`<div class="row"><span><b>${n+1}. ${esc(a.i.sku)}</b> · ${esc(a.i.name)}<small class="mt">Keluar ${a.count} kali · Total ${num(a.qty)} ${esc(a.i.unit)}</small></span><b>${a.count}x</b></div>`).join('')||'<p class="mt">Belum ada riwayat pemakaian.</p>';
 return `<div class="card"><h3>🔥 Barang Paling Sering Dipakai</h3>${used}</div>`;
}

/** Dua donut SVG: Kondisi Stok (Aman/Menipis/Habis per jenis barang) dan Status Request (Belum diterima / Sebagian / Selesai per dokumen PR). */
function dashboardStatusChartsHtml(){
 // Kondisi stok dihitung per jenis sparepart dengan konversi angka yang aman.
 const items=Array.isArray(S.items)?S.items:[];
 let safe=0,low=0,out=0;
 items.forEach(i=>{
  const stock=Number(i.stock)||0;
  const min=Number(i.min)||0;
  if(stock<=0)out++;
  else if(stock<=min)low++;
  else safe++;
 });
 const total=items.length;

 // Gabungkan dokumen aktif dan arsip tanpa menghitung ID yang sama dua kali.
 const active=Array.isArray(S.reqForms)?S.reqForms:[];
 const archived=Array.isArray(S.reqArchive)?S.reqArchive:[];
 const seen=new Set();
 let waiting=0,partial=0,completed=0;
 [...active,...archived].forEach(f=>{
  if(!f || (f.id && seen.has(f.id)))return;
  if(f.id)seen.add(f.id);
  const rows=Array.isArray(f.items)?f.items:[];
  const received=rows.filter(x=>x && x.received===true).length;
  if(archived.includes(f)){
   completed++;
  }else if(rows.length===0 || received===0){
   waiting++;
  }else if(received<rows.length){
   partial++;
  }else{
   completed++;
  }
 });

 const donut=(parts,colors,sum)=>{
  const R=15.9155; // keliling = 100, sehingga nilai dash = persen
  const total=parts.reduce((a,p)=>a+Math.max(0,Number(p.value)||0),0);
  const pctOf=v=>total>0?Math.max(0,Number(v)||0)/total*100:0;
  let cursor=0;
  const active=parts.filter(p=>(Number(p.value)||0)>0).length;
  const gap=active>1?1.2:0; // jarak kecil antar segmen
  const segs=parts.map((p,i)=>{
   const pct=pctOf(p.value);
   if(pct<=0)return '';
   const len=Math.max(0.01,pct-gap);
   const el=`<circle class="seg" cx="21" cy="21" r="${R}" stroke="${colors[i]}" stroke-dasharray="${len.toFixed(3)} ${(100-len).toFixed(3)}" stroke-dashoffset="${(-cursor).toFixed(3)}"><title>${p.label}: ${num(p.value)} (${pct.toFixed(1).replace('.',',')}%)</title></circle>`;
   cursor+=pct;
   return el;
  }).join('');
  const label=parts.map(p=>`${p.label}: ${num(p.value)}`).join(', ');
  return `<div class="status-donut-wrap"><div class="status-donut-box"><svg class="status-donut" viewBox="0 0 42 42" role="img" aria-label="${label}"><circle class="track" cx="21" cy="21" r="${R}"/>${segs}</svg><div class="status-donut-hole"><b>${num(total)}</b><small>Total</small></div></div><div class="status-legend">${parts.map((p,i)=>`<div><i style="background:${colors[i]}"></i><span>${p.label}</span><b>${num(p.value)}</b><em>${pctOf(p.value).toFixed(0)}%</em></div>`).join('')}</div></div>`;
 };
 return `<div class="grid two status-chart-grid"><div class="card"><h3>📊 Kondisi Stok</h3>${donut([{label:'Aman',value:safe},{label:'Menipis',value:low},{label:'Habis',value:out}],['#16a34a','#eab308','#dc2626'],total)}<p class="mt" style="margin-top:8px">Berdasarkan jumlah jenis sparepart.</p></div><div class="card"><h3>📋 Status Request</h3>${donut([{label:'Belum diterima',value:waiting},{label:'Diterima sebagian',value:partial},{label:'Selesai',value:completed}],['#f59e0b','#3b82f6','#16a34a'],waiting+partial+completed)}<p class="mt" style="margin-top:8px">Berdasarkan jumlah dokumen request aktif dan arsip selesai.</p></div></div>`;
}

 <div class="grid k">

/** Kerangka halaman: judul, toolbar pencarian/filter/urutan, legenda status, dan tabel kosong yang diisi drawTable(). */

 return `<div class="page-head"><div><h2>Daftar Suku Cadang (Inventory)</h2><p class="page-subtitle">Kelola master data, pantau saldo, atur ceklis notifikasi stok kritis/auto-request, dan lakukan transaksi cepat.</p></div><div class="page-actions"><button class="btn" onclick="openExportDialog()">🖨️ Export Laporan (PDF)</button>${currentUser==='user'?`<button class="btn p" onclick="go('master')">+ Master Spare Part Baru</button>`:''}</div></div>
 <div class="inventory-toolbar">
